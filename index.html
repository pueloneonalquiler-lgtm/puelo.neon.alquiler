<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puelo Neón · Alquiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #070c09;
    --bg-grad: radial-gradient(1200px 700px at 12% -10%, #0d2115 0%, #070c09 55%), radial-gradient(900px 600px at 110% 10%, #0a1a12 0%, #070c09 60%);
    --panel: #0c1512;
    --panel-2: #0f1a15;
    --panel-border: rgba(83, 255, 168, 0.16);
    --panel-border-soft: rgba(83, 255, 168, 0.08);
    --green: #4dffa3;
    --green-soft: #2fcf87;
    --green-dim: #143a29;
    --white: #f3fff8;
    --ink: #e9fbf1;
    --ink-dim: #8fab9d;
    --ink-faint: #5c7367;
    --danger: #ff7a63;
    --danger-dim: #3a1f19;
    --warn: #ffcf6b;
    --warn-dim: #3a3319;
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    --font-display: 'Syne', 'Manrope', sans-serif;
    --font-body: 'Manrope', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg-grad), var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  ::selection { background: var(--green-dim); color: var(--white); }
  a { color: inherit; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Layout ---------- */
  #app { display: flex; min-height: 100vh; min-height: 100dvh; }

  .sidebar {
    width: 250px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #0a1310 0%, #060a08 100%);
    border-right: 1px solid var(--panel-border-soft);
    display: flex;
    flex-direction: column;
    padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 6px 22px;
  }
  .brand img { width: 40px; height: auto; filter: drop-shadow(0 0 10px rgba(77,255,163,.35)); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text b { font-family: var(--font-display); font-size: 15px; letter-spacing: .01em; color: var(--white); }
  .brand-text span { font-size: 11px; color: var(--ink-faint); font-weight: 600; }

  nav.mainnav { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; min-height: 0; }
  nav.mainnav::-webkit-scrollbar { width: 5px; }
  nav.mainnav::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 10px; }
  .navitem {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: var(--radius-s);
    color: var(--ink-dim); font-weight: 600; font-size: 14px;
    cursor: pointer; border: 1px solid transparent; background: none;
    text-align: left; width: 100%;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .navitem svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
  .navitem:hover { background: rgba(77,255,163,.06); color: var(--ink); }
  .navitem.active {
    background: rgba(77,255,163,.1);
    border-color: var(--panel-border);
    color: var(--white);
  }
  .navitem.active svg { opacity: 1; filter: drop-shadow(0 0 4px rgba(77,255,163,.5)); }
  .navitem .badge {
    margin-left: auto; background: var(--danger); color: #1a0e0a; font-size: 10.5px;
    font-weight: 800; border-radius: 20px; padding: 1px 6px; min-width: 18px; text-align: center;
  }

  .sidebar-foot { padding: 12px 10px 0; font-size: 11px; color: var(--ink-faint); border-top: 1px solid var(--panel-border-soft); margin-top: 10px; }
  .sidebar-foot .dot { color: var(--green); }

  main#content {
    flex: 1; min-width: 0; padding: 28px 34px 60px;
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
  }
  .content-inner { max-width: 1080px; margin: 0 auto; }

  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .page-head h1 {
    font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; color: var(--white);
    letter-spacing: -.01em;
  }
  .page-head p.sub { margin: 0; color: var(--ink-dim); font-size: 14px; max-width: 46ch; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    border-radius: var(--radius-s); font-weight: 700; font-size: 13.5px;
    padding: 10px 16px; cursor: pointer; border: 1px solid transparent;
    transition: transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn-primary {
    background: var(--green); color: #06170f; border-color: var(--green);
    box-shadow: 0 0 0px rgba(77,255,163,0);
  }
  .btn-primary:hover { box-shadow: 0 0 18px rgba(77,255,163,.45); transform: translateY(-1px); }
  .btn-ghost {
    background: rgba(255,255,255,.02); color: var(--ink); border-color: var(--panel-border);
  }
  .btn-ghost:hover { background: rgba(77,255,163,.07); border-color: var(--green-soft); }
  .btn-danger { background: transparent; color: var(--danger); border-color: rgba(255,122,99,.35); }
  .btn-danger:hover { background: rgba(255,122,99,.1); }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn-wa { background: #12321f; color: #7dffb0; border-color: rgba(77,255,163,.3); }
  .btn-wa:hover { background: #16402a; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .btn-block { width: 100%; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--panel-border); color: var(--ink-dim); cursor: pointer;
  }
  .iconbtn:hover { color: var(--white); border-color: var(--green-soft); background: rgba(77,255,163,.06); }
  .iconbtn svg { width: 15px; height: 15px; }

  /* ---------- Cards / panels ---------- */
  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--panel-border-soft);
    border-radius: var(--radius-m);
    padding: 18px 18px;
  }
  .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat { padding: 16px 16px; }
  .stat .n { font-family: var(--font-display); font-size: 30px; color: var(--white); line-height: 1; }
  .stat .l { color: var(--ink-dim); font-size: 12.5px; margin-top: 7px; font-weight: 600; }
  .stat.glow .n { color: var(--green); text-shadow: 0 0 16px rgba(77,255,163,.45); }

  .section-title {
    font-family: var(--font-display); font-size: 15px; color: var(--white);
    margin: 30px 0 12px; display: flex; align-items: center; justify-content: space-between;
  }
  .section-title:first-child { margin-top: 0; }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .empty {
    border: 1px dashed var(--panel-border); border-radius: var(--radius-m);
    padding: 30px 20px; text-align: center; color: var(--ink-dim); font-size: 13.5px;
  }
  .empty b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 14.5px; }

  /* reminder row */
  .reminder {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: var(--panel-2); border: 1px solid var(--panel-border-soft); border-radius: var(--radius-s);
  }
  .reminder .dotstat { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .reminder .body { flex: 1; min-width: 0; }
  .reminder .ttl { font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .reminder .sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .reminder .when { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .sev-urgent .dotstat, .sev-urgent .when { background-color: var(--danger); color: var(--danger); }
  .sev-soon .dotstat, .sev-soon .when { background-color: var(--warn); color: var(--warn); }
  .sev-ok .dotstat, .sev-ok .when { background-color: var(--green); color: var(--green); }

  /* Client / rental / sub rows */
  .row-card {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--panel-2); border: 1px solid var(--panel-border-soft); border-radius: var(--radius-m);
  }
  .row-avatar {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    background: var(--green-dim); color: var(--green); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-main .t1 { font-weight: 700; font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
  .row-main .t2 { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: .01em; border: 1px solid transparent;
  }
  .pill-green { background: rgba(77,255,163,.12); color: var(--green); border-color: rgba(77,255,163,.28); }
  .pill-warn { background: rgba(255,207,107,.12); color: var(--warn); border-color: rgba(255,207,107,.28); }
  .pill-danger { background: rgba(255,122,99,.12); color: var(--danger); border-color: rgba(255,122,99,.28); }
  .pill-mute { background: rgba(255,255,255,.04); color: var(--ink-dim); border-color: var(--panel-border-soft); }

  /* Catalog grid */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .cat-card {
    background: var(--panel-2); border: 1px solid var(--panel-border-soft); border-radius: var(--radius-m);
    padding: 16px; display: flex; flex-direction: column; gap: 8px; position: relative;
  }
  .cat-card .swatch {
    width: 100%; height: 62px; border-radius: 10px; margin-bottom: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .02em;
    border: 1px solid var(--panel-border-soft);
  }
  .cat-card h4 { margin: 0; font-size: 15px; color: var(--white); font-family: var(--font-display); }
  .cat-card .theme { font-size: 11.5px; color: var(--green-soft); font-weight: 700; text-transform: none; }
  .cat-card p { margin: 0; font-size: 12.5px; color: var(--ink-dim); line-height: 1.45; flex: 1; }
  .cat-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .cat-card .price { font-weight: 800; color: var(--ink); font-size: 13.5px; }
  .cat-card .cardacts { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; }

  .filterbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .chip {
    padding: 6px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--panel-border); background: transparent; color: var(--ink-dim);
  }
  .chip.active { background: rgba(77,255,163,.12); border-color: var(--green-soft); color: var(--green); }
  .searchbox {
    display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 7px 13px; flex: 1; min-width: 160px; max-width: 280px;
  }
  .searchbox svg { width: 14px; height: 14px; color: var(--ink-faint); flex-shrink: 0; }
  .searchbox input { background: none; border: none; outline: none; color: var(--ink); font-size: 13px; width: 100%; }
  .searchbox input::placeholder { color: var(--ink-faint); }

  /* ---------- Forms / Modal ---------- */
  #modal-root:empty { display: none; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(2,6,4,.72); backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    z-index: 100; overflow-y: auto;
  }
  .modal {
    background: linear-gradient(180deg, #0f1c16, #0a130f); border: 1px solid var(--panel-border);
    border-radius: var(--radius-l); width: 100%; max-width: 460px; padding: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(77,255,163,.04);
  }
  .modal.wide { max-width: 620px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-head h3 { margin: 0; font-family: var(--font-display); font-size: 18px; color: var(--white); }
  .modal-close { background: none; border: none; color: var(--ink-dim); cursor: pointer; padding: 4px; border-radius: 6px; }
  .modal-close:hover { color: var(--white); background: rgba(255,255,255,.06); }
  .modal-close svg { width: 18px; height: 18px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-dim); margin-bottom: 6px; }
  .field .hint { font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number],
  .field input[type=date], .field select, .field textarea {
    width: 100%; background: #08110d; border: 1px solid var(--panel-border); color: var(--ink);
    border-radius: 9px; padding: 10px 12px; font-size: 13.5px; outline: none;
    transition: border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green-soft); }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .field-chip {
    padding: 7px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--panel-border); background: transparent; color: var(--ink-dim);
  }
  .field-chip.sel { background: rgba(77,255,163,.14); border-color: var(--green-soft); color: var(--green); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; }
  .err-msg { color: var(--danger); font-size: 12px; margin-top: 4px; min-height: 14px; }

  /* toast */
  #toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(12px);
    background: #0f2318; border: 1px solid rgba(77,255,163,.35); color: var(--white);
    padding: 11px 18px; border-radius: 30px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 200;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    display: flex; align-items: center; gap: 8px;
  }
  #toast svg { width: 15px; height: 15px; color: var(--green); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* mobile bottom nav */
  .bottomnav { display: none; }

  @media (max-width: 900px) {
    #app { flex-direction: column; }
    .sidebar {
      position: sticky; top: 0; height: auto; width: 100%; flex-direction: row;
      align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; border-right: none;
      border-bottom: 1px solid var(--panel-border-soft); z-index: 50;
    }
    .brand { padding: 0; }
    nav.mainnav, .sidebar-foot { display: none; }
    main#content { padding: 20px 16px calc(90px + env(safe-area-inset-bottom, 0px)); }
    .grid-stats { grid-template-columns: repeat(2, 1fr); }
    .field-row { grid-template-columns: 1fr; }
    .bottomnav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: #060a08ee; backdrop-filter: blur(8px); border-top: 1px solid var(--panel-border-soft);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
      justify-content: space-around;
    }
    .bottomnav button {
      background: none; border: none; color: var(--ink-faint); display: flex; flex-direction: column;
      align-items: center; gap: 3px; font-size: 9.5px; font-weight: 700; padding: 4px 6px; position: relative;
    }
    .bottomnav button svg { width: 19px; height: 19px; }
    .bottomnav button.active { color: var(--green); }
    .bottomnav button .bnbadge {
      position: absolute; top: -2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
    }
  }
  @media (max-width: 520px) {
    .grid-stats { grid-template-columns: repeat(2, 1fr); }
    .page-head { flex-direction: column; }
    .page-head .btn { width: 100%; }
  }

  /* ---------- Screens: gate / client gallery / admin ---------- */
  #gate-screen, #client-screen { display: none; }
  body[data-screen="gate"] #gate-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 24px 16px;
  }
  body[data-screen="client"] #client-screen { display: block; min-height: 100vh; padding-bottom: 50px; }
  body:not([data-screen="admin"]) #app { display: none !important; }
  body:not([data-screen="admin"]) .bottomnav { display: none !important; }
  body[data-screen="admin"] #app { display: flex; }

  .gate-wrap { max-width: 420px; margin: 0 auto; text-align: center; }
  .gate-logo { width: 140px; margin: 0 auto 20px; filter: drop-shadow(0 0 18px rgba(77,255,163,.3)); }
  .gate-title { font-family: var(--font-display); font-size: 30px; color: var(--white); margin: 0 0 6px; }
  .gate-sub { color: var(--ink-dim); margin: 0 0 30px; font-size: 14px; }
  .gate-btns { display: flex; flex-direction: column; gap: 14px; }
  .gate-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 22px;
    border-radius: var(--radius-m); border: 1px solid var(--panel-border); background: var(--panel-2);
    color: var(--white); font-family: var(--font-display); font-size: 16px; font-weight: 700;
    cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .gate-btn:hover { border-color: var(--green-soft); box-shadow: 0 0 24px rgba(77,255,163,.16); transform: translateY(-1px); }
  .gate-btn small { font-family: var(--font-body); font-weight: 600; color: var(--ink-dim); font-size: 11.5px; }
  .gate-btn-ico { font-size: 27px; line-height: 1; }

  .gallery-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 8px; max-width: 960px; margin: 0 auto;
  }
  .gallery-logo { width: 92px; height: auto; filter: drop-shadow(0 0 10px rgba(77,255,163,.3)); }
  .gallery-hero { text-align: center; padding: 10px 20px 26px; max-width: 640px; margin: 0 auto; }
  .gallery-hero h1 { font-family: var(--font-display); font-size: 28px; color: var(--white); margin: 0 0 8px; }
  .gallery-hero p { color: var(--ink-dim); font-size: 15px; margin: 0; }
  .gallery-section { max-width: 960px; margin: 0 auto; padding: 6px 0 22px; }
  .gallery-section h2 {
    font-family: var(--font-display); font-size: 16px; margin: 0 0 12px; padding: 0 20px;
  }
  .carousel {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 2px 20px 10px; -webkit-overflow-scrolling: touch;
  }
  .gallery-card {
    flex: 0 0 220px; scroll-snap-align: start; background: var(--panel-2);
    border: 1px solid var(--panel-border-soft); border-radius: var(--radius-m);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .gallery-swatch {
    height: 108px; display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 10px;
    border-bottom: 1px solid var(--panel-border-soft);
  }
  .gallery-card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .gallery-card-body h4 { margin: 0; font-family: var(--font-display); color: var(--white); font-size: 15px; }
  .gallery-card-body p { margin: 0; font-size: 12px; color: var(--ink-dim); line-height: 1.45; min-height: 30px; flex: 1; }

  /* ---------- Image picker ---------- */
  .imgpicker-row { display: flex; align-items: center; gap: 12px; }
  .imgpicker-box {
    width: 84px; height: 84px; border-radius: 10px; border: 1px dashed var(--panel-border);
    background: #08110d; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  }
  .imgpicker-box svg { width: 26px; height: 26px; }
  .imgpicker-actions { display: flex; flex-direction: column; gap: 6px; }
  .imgpicker-actions label.btn { cursor: pointer; }

  /* ---------- Categorías manager ---------- */
  .tema-manage-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--panel-border-soft); }
  .tema-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .tema-manage-row .nm { flex: 1; font-size: 13px; font-weight: 700; color: var(--ink); }

  /* ---------- Personalizado ---------- */
  .cta-personalizado {
    display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: var(--radius-m);
    background: linear-gradient(120deg, rgba(77,255,163,.12), rgba(77,255,163,.02));
    border: 1px solid var(--panel-border); margin: 6px 20px 26px; max-width: 920px; margin-left:auto; margin-right:auto;
  }
  .cta-personalizado .ico { font-size: 30px; flex-shrink: 0; }
  .cta-personalizado .txt { flex: 1; }
  .cta-personalizado h3 { margin: 0 0 3px; font-family: var(--font-display); color: var(--white); font-size: 16px; }
  .cta-personalizado p { margin: 0; color: var(--ink-dim); font-size: 12.5px; }
  .estilo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; margin: 4px 0 6px; }
  .estilo-opt { border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--panel-2); text-align: center; }
  .estilo-opt.sel { border-color: var(--green-soft); box-shadow: 0 0 0 1px var(--green-soft) inset; }
  .estilo-opt .thumb { height: 70px; display: flex; align-items: center; justify-content: center; background: #08110d; }
  .estilo-opt .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .estilo-opt .thumb svg { width: 22px; height: 22px; color: var(--ink-faint); }
  .estilo-opt .lbl { font-size: 10.5px; font-weight: 700; padding: 6px 4px; color: var(--ink-dim); line-height: 1.25; }
  .estilo-opt.sel .lbl { color: var(--green); }

  .gallery-social { display: flex; justify-content: center; gap: 12px; padding: 8px 20px 30px; }
  .gallery-social a {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel-2);
    display: flex; align-items: center; justify-content: center; color: var(--ink-dim); text-decoration: none;
  }
  .gallery-social a svg { width: 19px; height: 19px; }
  .gallery-social a:hover { color: var(--green); border-color: var(--green-soft); }

  /* ---------- Hero con fondo rotativo y elementos libres ---------- */
  .hero-wrap {
    position: relative; overflow: hidden; background: #08110d;
    height: 64vh; min-height: 460px; max-height: 620px;
    max-width: 560px; margin: 0 auto;
    container-type: inline-size;
  }
  @media (max-width: 900px) {
    .hero-wrap { max-width: none; }
  }
  .hero-bg { position: absolute; inset: 0; z-index: 0; }
  .hero-bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.4s ease, filter .3s ease; }
  .hero-bg img.active { opacity: var(--bg-opacity, .45); }
  .hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,12,9,.45), rgba(7,12,9,.95)); }
  .hero-back { position: absolute; z-index: 2; top: calc(14px + env(safe-area-inset-top,0px)); right: 16px; }
  .hero-stage { position: absolute; inset: 0; z-index: 1; }
  .hero-el { position: absolute; transform: translate(-50%,-50%); text-align: center; max-width: 92%; }
  .hero-logo-img { width: 100%; height: auto; max-height: 32vh; object-fit: contain; display: block; }
  .hero-pill-text { display: inline-flex; align-items: center; gap: 6px; background: rgba(77,255,163,.14); border: 1px solid var(--green-soft); padding: 7px 15px; border-radius: 20px; white-space: nowrap; }
  .hero-plain-text { white-space: pre-wrap; line-height: 1.25; font-family: var(--font-display); }
  .hero-scrolldown {
    position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom,0px)); transform: translateX(-50%);
    z-index: 2; color: rgba(255,255,255,.6); animation: hero-bob 1.8s ease-in-out infinite;
  }
  .hero-scrolldown svg { width: 22px; height: 22px; transform: rotate(90deg); }
  @keyframes hero-bob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(7px); } }

  /* ---------- Fotos (trabajos / clientes) ---------- */
  .foto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; }
  .foto-tile { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--panel-2); border: 1px solid var(--panel-border-soft); }
  .foto-tile img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .foto-add-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 1px dashed var(--panel-border); border-radius: 12px; aspect-ratio: 1; color: var(--ink-dim);
    cursor: pointer; background: #08110d; font-size: 11.5px; font-weight: 700; text-align: center; padding: 8px;
  }
  .foto-add-tile svg { width: 22px; height: 22px; }
  .foto-add-tile:hover { border-color: var(--green-soft); color: var(--green); }

  /* ---------- Negocio: presupuestos / stock / gastos ---------- */
  .breakdown-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-dim); padding: 3px 0; }

  /* ---------- Pantalla de bienvenida (splash) ---------- */
  #splash-screen { display: none; }
  #splash-screen.active { display: block; position: fixed; inset: 0; z-index: 90; }
  .splash-overlay { position: fixed; inset: 0; z-index: 300; cursor: pointer; }
  .splash {
    position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(900px 640px at 50% 28%, #0d2115 0%, #070c09 68%);
    transition: opacity .4s ease;
  }
  .splash.out { opacity: 0; pointer-events: none; }
  .splash-stage {
    position: absolute; top: 0; bottom: 0; left: 50%; width: min(100%, 520px); transform: translateX(-50%);
    container-type: inline-size; animation: splash-fade .8s ease both;
  }
  .splash-loader { position: absolute; left: 0; right: 0; bottom: calc(48px + env(safe-area-inset-bottom,0px)); display: flex; justify-content: center; }
  .splash-hint { position: absolute; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top,0px)); text-align: center; font-size: 12px; color: var(--ink-faint); }
  .splash-preview-box { position: relative; height: 440px; max-width: 280px; border-radius: 22px; overflow: hidden; border: 1px solid var(--panel-border); cursor: pointer; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(77,255,163,.18); border-top-color: var(--green); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes splash-fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Botones flotantes (galería) ---------- */
  .floating-layer { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
  .floating-btn {
    position: absolute; pointer-events: auto;
    display: inline-flex; align-items: center; gap: .5em; font-size: 13px; padding: .85em 1.4em; border-radius: 30px;
    background: var(--green); color: #06170f; font-weight: 800; border: none; cursor: pointer;
    white-space: nowrap; box-shadow: 0 10px 28px rgba(0,0,0,.45), 0 0 18px rgba(77,255,163,.35);
  }
  .floating-btn:active { filter: brightness(.9); }
  .fb-preview { position: static !important; }

/* ---------- Tienda ---------- */
  #shop-screen { display: none; }
  body[data-screen="shop"] #shop-screen { display: block; min-height: 100vh; padding-bottom: 96px; }
  .shop-header {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top,0px)) 16px 12px; background: rgba(7,12,9,.93);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--panel-border-soft);
  }
  .shop-header h1 { flex: 1; margin: 0; font-family: var(--font-display); font-size: 20px; color: var(--white); }
  .shop-cart-btn {
    position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--panel-border);
    background: var(--panel-2); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .shop-cart-btn svg { width: 20px; height: 20px; }
  .shop-cart-btn .cbadge {
    position: absolute; top: -4px; right: -4px; background: var(--green); color: #06170f; font-size: 11px; font-weight: 800;
    border-radius: 20px; min-width: 18px; height: 18px; padding: 0 5px; display: flex; align-items: center; justify-content: center;
  }
  .shop-body { max-width: 980px; margin: 0 auto; padding: 16px; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
  .shop-card { background: var(--panel-2); border: 1px solid var(--panel-border-soft); border-radius: var(--radius-m); overflow: hidden; display: flex; flex-direction: column; }
  .shop-img { height: 120px; background-size: cover; background-position: center; cursor: zoom-in; }
  .shop-img.placeholder { display: flex; align-items: center; justify-content: center; background: #08110d; color: var(--ink-faint); cursor: default; }
  .shop-img.placeholder svg { width: 30px; height: 30px; }
  .shop-card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .shop-card-body h4 { margin: 0; font-size: 13.5px; color: var(--white); line-height: 1.3; flex: 1; }
  .shop-card-body .price { font-family: var(--font-display); font-size: 17px; color: var(--green); }
  .shop-card-body .low { font-size: 11px; color: var(--warn); font-weight: 700; min-height: 14px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--green-soft); border-radius: 8px; overflow: hidden; }
  .stepper button { width: 42px; height: 36px; background: rgba(77,255,163,.1); color: var(--green); border: none; font-size: 18px; font-weight: 800; cursor: pointer; }
  .stepper span { font-weight: 800; color: var(--white); }
  .shop-cartbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background: rgba(6,10,8,.96); border-top: 1px solid var(--panel-border);
  }
  body[data-screen="shop"] #toast { bottom: calc(86px + env(safe-area-inset-bottom,0px)); }
  .shop-maint { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; gap: 14px; }
  .shop-preview-banner { background: rgba(255,207,107,.12); border-bottom: 1px solid rgba(255,207,107,.3); color: var(--warn); text-align: center; font-size: 12px; font-weight: 700; padding: 8px 12px; }
  .cart-line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--panel-border-soft); }
  .cart-line .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--ink); }
  .cart-line .nm small { display: block; color: var(--ink-dim); font-weight: 600; margin-top: 2px; }
  .cart-line .stepper { width: 112px; flex-shrink: 0; }
  .cart-line .stepper button { width: 32px; height: 30px; }
  .tienda-status { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; border-color: rgba(255,207,107,.35); }
  .tienda-status.open { border-color: rgba(77,255,163,.35); }
  .tienda-status b { display: block; color: var(--white); font-size: 14.5px; }
  .tienda-status span.d { font-size: 12.5px; color: var(--ink-dim); }

  /* ---------- Botón compartir página (panel admin) ---------- */
  #share-slot { margin: 4px 0 12px; }
  .share-btn { width: 100%; }
  @media (max-width: 900px) {
    #share-slot { margin: 0 0 0 auto; }
    .share-btn { width: auto; padding: 8px 12px; font-size: 12px; }
  }

  .gallery-video { max-width: 720px; margin: 0 auto 8px; padding: 0 20px; }
  .gallery-video .frame { position: relative; padding-top: 56.25%; border-radius: 14px; overflow: hidden; border: 1px solid var(--panel-border-soft); }
  .gallery-video iframe, .gallery-video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

  /* ---------- Editor visual de portada (arrastrar/soltar) ---------- */
  .hero-editor-canvas {
    position: relative; height: min(68vh, 620px); width: auto; aspect-ratio: 9 / 19.5; max-width: min(94vw, 340px);
    margin: 0 auto; border-radius: 22px; overflow: hidden; background: #08110d; border: 1px solid var(--panel-border);
    background-size: cover; background-position: center; container-type: inline-size;
  }
  .hero-el.editable { position: absolute; transform: translate(-50%,-50%); cursor: grab; touch-action: none; padding: 2px; }
  .hero-el.editable.dragging { cursor: grabbing; }
  .hero-el.editable:hover, .hero-el.editable:focus-within { outline: 1px dashed var(--green-soft); outline-offset: 6px; }
  .hero-el-actions { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; opacity: 0; transition: opacity .15s ease; }
  .hero-el.editable:hover .hero-el-actions { opacity: 1; }
  .hero-el-btn { width: 26px; height: 26px; border-radius: 6px; background: #0f1c16; border: 1px solid var(--panel-border); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .hero-el-btn svg { width: 13px; height: 13px; }
  .hero-el-handle { position: absolute; right: -8px; bottom: -8px; width: 16px; height: 16px; border-radius: 4px; background: var(--green); border: 2px solid #06170f; cursor: nwse-resize; opacity: 0; transition: opacity .15s ease; }
  .hero-el.editable:hover .hero-el-handle { opacity: 1; }
</style>
</head>

function uid(){ return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  if (isNaN(d)) return s;
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function fmtMoney(n){
  const v = Number(n)||0;
  return '$' + v.toLocaleString('es-AR');
}
function addDays(s, days){ const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+Number(days)); return d.toISOString().slice(0,10); }
function addMonths(s, months){ const d = new Date(s+'T00:00:00'); d.setMonth(d.getMonth()+Number(months)); return d.toISOString().slice(0,10); }
function daysUntil(s){
  if(!s) return 9999;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(s+'T00:00:00');
  return Math.round((d - today) / 86400000);
}
function severity(days){ if (days <= 1) return 'urgent'; if (days <= 3) return 'soon'; return 'ok'; }
function severityLabel(days){

  if (days === 0) return 'Hoy';

}

/* ============================== DATA LAYER ============================== */
function supabaseConfigured(){
  return SUPABASE_URL && SUPABASE_ANON_KEY &&
    SUPABASE_URL.indexOf('TU_SUPABASE') === -1 && SUPABASE_ANON_KEY.indexOf('TU_SUPABASE') === -1 &&
    window.supabase && typeof window.supabase.createClient === 'function';
}

async function initData(){
  try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }
  catch(e){ db = null; }

  if (db){
    dbMode = 'cloud';
    let pending = COLS.length;
    COLS.forEach(col => {
      db.collection(col).onSnapshot(
        snap => {
          const map = {};
          snap.docs.forEach(d => { if (d.exists) map[d.id] = d.data(); });
          state[col] = map;
          if (pending > 0){ pending--; if (pending === 0) afterFirstLoad(); }
          render();
        },
        err => {
          console.error('db error on', col, err);
          if (dbMode === 'cloud'){ dbMode = 'local'; loadLocalAll(); afterFirstLoad(); render(); }
        }
      );
    });
  } else if (supabaseConfigured()){
    dbMode = 'supabase';
    try { await initSupabase(); }
    catch(e){ console.error('supabase init failed', e); dbMode = 'local'; loadLocalAll(); afterFirstLoad(); render(); }
  } else {
    dbMode = 'local';
    loadLocalAll();
    afterFirstLoad();
    render();
  }
}

async function initSupabase(){
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const results = await Promise.all(COLS.map(col =>
    sbClient.from(SUPABASE_TABLE).select('id,data').eq('collection', col)
  ));
  results.forEach((res, i) => {
    if (res.error) throw res.error;
    const map = {};
    (res.data || []).forEach(r => { map[r.id] = r.data; });
    state[COLS[i]] = map;
  });
  afterFirstLoad();
  render();

  sbClient.channel('puelo_records_sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: SUPABASE_TABLE }, payload => {
      const row = (payload.new && Object.keys(payload.new).length) ? payload.new : payload.old;
      if (!row || COLS.indexOf(row.collection) === -1) return;
      if (payload.eventType === 'DELETE') delete state[row.collection][row.id];
      else state[row.collection][row.id] = row.data;
      render();
    })
    .subscribe();
}

function loadLocalAll(){
  COLS.forEach(col => {
    try {
      const raw = localStorage.getItem('pueloneon_'+col);
      state[col] = raw ? JSON.parse(raw) : {};
    } catch(e){ state[col] = {}; }
  });
}
function persistLocal(col){
  try { localStorage.setItem('pueloneon_'+col, JSON.stringify(state[col])); } catch(e){}
}

async function writeDoc(col, id, data){
  if (dbMode === 'cloud' && db){
    try { await db.collection(col).doc(id).set(data); }
    catch(e){ console.error('write failed', col, id, e); showToast('No se pudo guardar. Probá de nuevo.'); throw e; }
  } else if (dbMode === 'supabase' && sbClient){
    try {
      const { error } = await sbClient.from(SUPABASE_TABLE)
        .upsert({ collection: col, id: id, data: data, updated_at: new Date().toISOString() }, { onConflict: 'collection,id' });
      if (error) throw error;
      state[col][id] = data;
      render();
    } catch(e){ console.error('write failed', col, id, e); showToast('No se pudo guardar. Probá de nuevo.'); throw e; }
  } else {
    state[col][id] = data;
    persistLocal(col);
    render();
  }
}
async function patchDoc(col, id, patch){
  const current = getDoc(col, id) || {};
  const merged = Object.assign({}, current, patch);
  delete merged.id;
  return writeDoc(col, id, merged);
}
async function deleteDoc(col, id){
  if (dbMode === 'cloud' && db){
    try { await db.collection(col).doc(id).delete(); }
    catch(e){ console.error('delete failed', col, id, e); showToast('No se pudo eliminar.'); throw e; }
  } else if (dbMode === 'supabase' && sbClient){
    try {
      const { error } = await sbClient.from(SUPABASE_TABLE).delete().eq('collection', col).eq('id', id);
      if (error) throw error;
      delete state[col][id];
      render();
    } catch(e){ console.error('delete failed', col, id, e); showToast('No se pudo eliminar.'); throw e; }
  } else {
    delete state[col][id];
    persistLocal(col);
    render();
  }
}

function afterFirstLoad(){

  if (arr('temas').length === 0) TEMAS_SEED.forEach(t => writeDoc('temas', uid(), t));

  if (arr('carteles').length === 0 && arr('clientes').length === 0 && arr('alquileres').length === 0 && arr('suscripciones').length === 0){

}

  if (y.length === 2) y = '20' + y;
  d = d.padStart(2,'0'); m = m.padStart(2,'0');

/* ---- Compresión de imágenes en el navegador antes de guardarlas ---- */
function readImageAsDataURL(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const isPng = file.type === 'image/png';
        resolve(isPng ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality || 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function bindImagePicker(inputId, previewId, currentValue, onChange){
  let value = currentValue || null;
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);
  function paint(){
    preview.innerHTML = value
      ? `<img src="${value}" style="width:100%;height:100%;object-fit:cover;">`
      : `<span style="color:var(--ink-faint);">${ICON.image}</span>`;
  }
  paint();
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      value = await readImageAsDataURL(file, 900, 0.75);
      paint();
      onChange(value);
    } catch(e){ console.error(e); showToast('No se pudo procesar la imagen.'); }
  };
  return { get: () => value, clear: () => { value = null; paint(); onChange(null); input.value = ''; } };
}

/* ============================== DERIVED / REMINDERS ============================== */
function computeReminders(){
  const out = [];
  arr('alquileres').filter(a => a.estado === 'activo').forEach(a => {
    const d = daysUntil(a.fechaRetiro);
    if (d <= 3){
      out.push({ tipo: 'retiro', dias: d, fecha: a.fechaRetiro, titulo: `Retirar "${a.cartelNombre}"`, sub: `Cliente: ${a.clienteNombre}`, ref: a });
    }
  });
  arr('suscripciones').filter(s => s.estado === 'activa').forEach(s => {
    const dFin = daysUntil(s.fechaFin);
    if (dFin <= 3){
      out.push({ tipo: 'fin_sub', dias: dFin, fecha: s.fechaFin, titulo: `Vence suscripción de ${s.clienteNombre}`, sub: `Plan de ${s.planMeses} ${s.planMeses===1?'mes':'meses'} — finaliza`, ref: s });
    } else {
      const d = daysUntil(s.proximoCambio);
      if (d <= 3){
        out.push({ tipo: 'cambio', dias: d, fecha: s.proximoCambio, titulo: `Cambiar vidriera de ${s.clienteNombre}`, sub: `Cartel actual: ${s.cartelActualNombre||'—'}`, ref: s });
      }
    }
  });
  out.sort((a,b) => a.dias - b.dias);
  return out;
}

function getSplash(){

function cacheSplash(){
  const raw = getDoc('config','splash');
  if (!raw) return;
  try { localStorage.setItem('pueloneon_splash_cache', JSON.stringify(raw)); } catch(e){}
}
function splashHtml(cfg, opts){
  opts = opts || {};
  const elementos = (cfg.elementos && cfg.elementos.length) ? cfg.elementos : DEFAULT_SPLASH.elementos;
  return `
    <div class="splash">
      <div class="splash-stage">${elementos.map(heroElementHtml).join('')}</div>
      <div class="splash-loader"><div class="spinner"></div></div>
      ${opts.hint ? `<div class="splash-hint">${opts.hint}</div>` : ''}
    </div>`;
}
function maybeStartSplash(){
  if (splashDone || splashActive) return;
  const cfg = getSplash();
  const minMs = cfg.activo === false ? 0 : Math.max(1, Number(cfg.duracion) || 3) * 1000;
  if (minMs === 0 && dataLoaded){ splashDone = true; return; }
  const host = document.getElementById('splash-screen');
  if (!host) return;
  host.innerHTML = splashHtml(cfg);
  host.classList.add('active');
  splashActive = true;
  const t0 = Date.now();
  clearInterval(splashTimer);
  splashTimer = setInterval(() => {
    const elapsed = Date.now() - t0;
    if ((elapsed >= minMs && dataLoaded) || elapsed >= 15000) finishSplash();
  }, 150);
}
function finishSplash(){
  clearInterval(splashTimer); splashTimer = null;
  splashActive = false; splashDone = true;
  const host = document.getElementById('splash-screen');
  if (!host) return;
  const root = host.querySelector('.splash');
  if (root) root.classList.add('out');
  setTimeout(() => { host.classList.remove('active'); host.innerHTML = ''; }, 450);
}
function hideSplashNow(){
  clearInterval(splashTimer); splashTimer = null; splashActive = false;
  const host = document.getElementById('splash-screen');
  if (host){ host.classList.remove('active'); host.innerHTML = ''; }
}
function previewSplash(cfg){
  const old = document.getElementById('splash-preview');

  d.className = 'splash-overlay';

  document.body.appendChild(d);
}

function getPresupuestoConfig(){

    precioNeonMetro: raw.precioNeonMetro != null ? raw.precioNeonMetro : DEFAULT_PRESUPUESTO_CFG.precioNeonMetro,
    fuentes: (raw.fuentes && raw.fuentes.length === 4) ? raw.fuentes : DEFAULT_PRESUPUESTO_CFG.fuentes,
  };
}
function fuenteSegunMetros(metros, fuentes){
  const m = Number(metros) || 0;
  if (m <= 0) return 0;
  for (const f of fuentes) { if (m <= f.max) return Number(f.precio) || 0; }
  return Number(fuentes[fuentes.length-1].precio) || 0;
}
function computePresupuestoTotal(alto, ancho, neonMetros, cfg){
  const areaM2 = (Number(alto)||0)/100 * (Number(ancho)||0)/100;
  const costoAcrilico = areaM2 * (Number(cfg.precioAcrilicoM2)||0);
  const costoNeon = (Number(neonMetros)||0) * (Number(cfg.precioNeonMetro)||0);
  const costoFuente = fuenteSegunMetros(neonMetros, cfg.fuentes);
  const total = costoAcrilico + costoNeon + costoFuente;
  return { areaM2, costoAcrilico, costoNeon, costoFuente, total };
}

        <div class="hero-el editable" data-el-id="${el.id}" style="left:${el.x}%; top:${el.y}%; width:${el.w}%;">
          <img src="${src}" class="hero-logo-img" style="pointer-events:none;" alt="Logo">
          <div class="hero-el-actions">
            <label class="hero-el-btn" title="Cambiar imagen del logo">${ICON.upload}<input type="file" accept="image/*" class="visually-hidden" data-el-logo-input></label>
          </div>
          <div class="hero-el-handle" data-resize-handle title="Arrastrá para agrandar/achicar"></div>
        </div>`;
    }
    const textStyle = `font-size:clamp(12px, ${el.fontSizeVw}cqw, ${el.maxPx||34}px); color:${el.color||'#f3fff8'}; font-weight:${el.bold?800:600};`;
    const cls = el.pill ? 'hero-pill-text' : 'hero-plain-text';
    return `
      <div class="hero-el editable" data-el-id="${el.id}" style="left:${el.x}%; top:${el.y}%;">
        <div class="${cls} hero-el-text" style="${textStyle} pointer-events:none;">${esc(el.texto)}</div>
        <div class="hero-el-actions">
          <button type="button" class="hero-el-btn" data-el-edit title="Editar texto">${ICON.edit}</button>
          <button type="button" class="hero-el-btn" data-el-del title="Eliminar">${ICON.trash}</button>
        </div>
        <div class="hero-el-handle" data-resize-handle title="Arrastrá para agrandar/achicar"></div>
      </div>`;
  }

  function fbEditableHtml(b){
    return `
      <div class="hero-el editable fb-el" data-fb-id="${b.id}" style="left:${b.x}%; top:${b.y}%; transform:translate(-${b.x}%, -${b.y}%);">
        <div class="floating-btn fb-preview" style="font-size:3.4cqw; pointer-events:none;">${b.emoji?esc(b.emoji)+' ':''}${esc(b.texto)}</div>
        <div class="hero-el-actions">
          <button type="button" class="hero-el-btn" data-fb-edit title="Editar botón">${ICON.edit}</button>
          <button type="button" class="hero-el-btn" data-fb-del title="Eliminar botón">${ICON.trash}</button>
        </div>
      </div>`;
  }

  function canvasHtml(){
    let bgStyle = '';
    if (isSplash){
      bgStyle = 'background: radial-gradient(900px 640px at 50% 28%, #0d2115 0%, #070c09 68%);';
    } else if (fondoPreview){
      const topA = Math.max(0.15, 0.55 - fondoOpacidad*0.3);
      const botA = Math.max(0.55, 0.95 - fondoOpacidad*0.3);
      bgStyle = `background-image: linear-gradient(180deg, rgba(7,12,9,${topA}), rgba(7,12,9,${botA})), url('${fondoPreview}');`;
    }
    return `<div class="hero-editor-canvas" id="hero-canvas" style="${bgStyle}">${elementos.map(elEditableHtml).join('')}${fbs.map(fbEditableHtml).join('')}</div>`;
  }

  function bindDrag(canvas, div, obj, edgeAware){
    div.addEventListener('pointerdown', (e) => {
      if (e.target.closest('[data-resize-handle]') || e.target.closest('.hero-el-btn')) return;
      e.preventDefault();
      try { div.setPointerCapture(e.pointerId); } catch(err){}
      const rect = canvas.getBoundingClientRect();
      const denomW = edgeAware ? Math.max(1, rect.width - div.offsetWidth) : rect.width;
      const denomH = edgeAware ? Math.max(1, rect.height - div.offsetHeight) : rect.height;
      const lo = edgeAware ? 2 : 3, hi = edgeAware ? 98 : 97;
      const startX = e.clientX, startY = e.clientY;
      const origX = obj.x, origY = obj.y;
      div.classList.add('dragging');
      function move(ev){
        obj.x = clampNum(origX + (ev.clientX - startX) / denomW * 100, lo, hi);
        obj.y = clampNum(origY + (ev.clientY - startY) / denomH * 100, lo, hi);
        div.style.left = obj.x + '%';
        div.style.top = obj.y + '%';
        if (edgeAware) div.style.transform = `translate(-${obj.x}%, -${obj.y}%)`;
      }
      function up(){
        div.removeEventListener('pointermove', move);
        div.removeEventListener('pointerup', up);
        div.removeEventListener('pointercancel', up);
        div.classList.remove('dragging');
      }
      div.addEventListener('pointermove', move);
      div.addEventListener('pointerup', up);
      div.addEventListener('pointercancel', up);
    });
  }

  function bindCanvasEvents(){
    const canvas = document.getElementById('hero-canvas');
    if (!canvas) return;
    elementos.forEach(el => {
      const div = canvas.querySelector(`[data-el-id="${el.id}"]`);
      if (!div) return;
      bindDrag(canvas, div, el, false);

      const handle = div.querySelector('[data-resize-handle]');
      if (handle){
        handle.addEventListener('pointerdown', (e) => {
          e.stopPropagation(); e.preventDefault();
          try { handle.setPointerCapture(e.pointerId); } catch(err){}
          const rect = canvas.getBoundingClientRect();
          const startX = e.clientX;
          const orig = el.tipo === 'logo' ? el.w : el.fontSizeVw;
          function move(ev){
            const dxPct = (ev.clientX - startX) / rect.width * 100;
            if (el.tipo === 'logo'){
              el.w = clampNum(orig + dxPct, 12, 70);
              div.style.width = el.w + '%';
            } else {
              el.fontSizeVw = clampNum(orig + dxPct * 0.3, 2.5, 13);
              const txt = div.querySelector('.hero-el-text');
              if (txt) txt.style.fontSize = `clamp(12px, ${el.fontSizeVw}cqw, ${el.maxPx||34}px)`;
            }
          }
          function up(){
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', up);
            handle.removeEventListener('pointercancel', up);
          }
          handle.addEventListener('pointermove', move);
          handle.addEventListener('pointerup', up);
          handle.addEventListener('pointercancel', up);
        });
      }

      const editBtn = div.querySelector('[data-el-edit]');
      if (editBtn) editBtn.onclick = () => { editingId = el.id; mode = 'edit'; paint(); };

      const delBtn = div.querySelector('[data-el-del]');
      if (delBtn) delBtn.onclick = () => { elementos = elementos.filter(x => x.id !== el.id); paint(); };

      const logoInput = div.querySelector('[data-el-logo-input]');
      if (logoInput){
        logoInput.onchange = async () => {
          const file = logoInput.files && logoInput.files[0];
          if (!file) return;
          try { el.imagen = await readImageAsDataURL(file, 500, 0.85); paint(); }
          catch(err){ console.error(err); showToast('No se pudo procesar la imagen.'); }
        };
      }
    });

    fbs.forEach(b => {
      const div = canvas.querySelector(`[data-fb-id="${b.id}"]`);
      if (!div) return;
      bindDrag(canvas, div, b, true);
      const eb = div.querySelector('[data-fb-edit]');
      if (eb) eb.onclick = () => { editingFbId = b.id; mode = 'fb-edit'; paint(); };
      const db = div.querySelector('[data-fb-del]');
      if (db) db.onclick = () => {
        fbs = fbs.filter(x => x.id !== b.id);
        if (fbExisting.has(b.id)) fbRemoved.push(b.id);
        paint();
      };
    });
  }

  function paint(){
    if (mode === 'canvas'){
      const titulo = isSplash ? 'Editor de pantalla de bienvenida' : 'Editor visual de portada';
      const ayuda = isSplash
        ? 'Es lo primero que ve el cliente al entrar. Arrastrá el logo y los textos para moverlos; tirá del cuadradito verde para agrandar o achicar. Acá no hay apuro: se queda así hasta que toques Guardar.'
        : 'Arrastrá el logo, los textos y los botones flotantes (las píldoras verdes) para ubicarlos donde quieras. Tirá del cuadradito verde para agrandar o achicar.';
      const extra = isSplash ? `
        <div class="field" style="margin-top:14px;"><label><input type="checkbox" id="sp-activo" ${activo?'checked':''} style="width:auto; margin-right:6px; vertical-align:middle;">Mostrar la pantalla de bienvenida al entrar</label></div>
        <div class="field"><label>Duración mínima: <b id="sp-dur-label">${duracion} s</b></label>
          <input type="range" id="sp-duracion" min="1" max="10" step="1" value="${duracion}" style="width:100%;">
          <div class="hint">Si la galería tarda más en cargar, la pantalla se queda hasta que esté lista.</div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="sp-preview">Ver cómo queda a pantalla completa</button>
      ` : `
        <div class="field" style="margin-top:14px;">
          <label>Brillo de las fotos de fondo</label>
          <input type="range" id="hero-brillo" min="10" max="85" step="5" value="${Math.round(fondoOpacidad*100)}" style="width:100%;">
          <div class="hint">Más brillo hace que las fotos se vean más fuerte; menos brillo deja el texto más legible.</div>
        </div>
        <div class="field"><label>Video de YouTube (opcional)</label><input type="text" id="hero-video" value="${esc(videoUrl)}" placeholder="https://youtube.com/watch?v=..."></div>
      `;
      openModal(`
        ${modalHead(titulo)}
        <p style="margin:-6px 0 12px; font-size:12.5px; color:var(--ink-dim);">${ayuda}</p>
        <div id="hero-canvas-wrap">${canvasHtml()}</div>
        <div style="display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-top:12px;">
          <button type="button" class="btn btn-ghost btn-sm" id="hero-add-text">${ICON.plus}Agregar texto</button>
          ${isSplash ? '' : `<button type="button" class="btn btn-ghost btn-sm" id="hero-add-fb">${ICON.plus}Agregar botón flotante</button>`}
        </div>
        ${extra}
        <div class="modal-actions">
          <button class="btn btn-ghost modal-close">Cancelar</button>
          <button class="btn btn-primary" id="hero-save">Guardar</button>
        </div>
      `, { wide: true });
      bindCanvasEvents();

      document.getElementById('hero-add-text').onclick = () => {
        const nuevo = { id: uid(), tipo: 'texto', x: 50, y: 78, fontSizeVw: 4, maxPx: 18, texto: 'Nuevo texto', color: '#f3fff8', bold: false, pill: false };
        elementos.push(nuevo);
        editingId = nuevo.id; mode = 'edit'; paint();
      };

      if (isSplash){
        document.getElementById('sp-activo').onchange = (e) => { activo = e.target.checked; };
        document.getElementById('sp-duracion').oninput = (e) => {
          duracion = Number(e.target.value) || 3;
          document.getElementById('sp-dur-label').textContent = duracion + ' s';
        };
        document.getElementById('sp-preview').onclick = () => previewSplash({ elementos, activo, duracion });
      } else {
        document.getElementById('hero-brillo').oninput = (e) => {
          fondoOpacidad = Number(e.target.value)/100;
          document.getElementById('hero-canvas-wrap').innerHTML = canvasHtml();
          bindCanvasEvents();
        };
        document.getElementById('hero-video').oninput = (e) => { videoUrl = e.target.value; };
        document.getElementById('hero-add-fb').onclick = () => {
          const nuevo = { id: uid(), texto: '', emoji: '', tipo: 'whatsapp', valor: '', x: 96, y: Math.max(8, 96 - fbs.length * 9), isNew: true };
          fbs.push(nuevo);
          editingFbId = nuevo.id; mode = 'fb-edit'; paint();
        };
      }

      document.getElementById('hero-save').onclick = async () => {
        if (isSplash){
          await patchDoc('config', 'splash', { elementos, activo, duracion });
          cacheSplash();
          closeModal(); render();
          showToast('Pantalla de bienvenida guardada');
          return;
        }
        await patchDoc('config', 'portada', { elementos, videoUrl: videoUrl.trim(), fondoOpacidad });
        for (const id of fbRemoved) await deleteDoc('botones_flotantes', id);
        for (let i = 0; i < fbs.length; i++){
          const b = fbs[i];
          await writeDoc('botones_flotantes', b.id, {
            texto: b.texto, emoji: b.emoji || '', tipo: b.tipo, valor: b.valor || '', orden: i,
            x: Math.round(b.x * 10) / 10, y: Math.round(b.y * 10) / 10,
          });
        }
        closeModal(); render();
        showToast('Diseño de portada guardado');
      };

    } else if (mode === 'fb-edit'){
      const b = fbs.find(x => x.id === editingFbId);
      if (!b){ mode = 'canvas'; paint(); return; }
      let tipoSel = b.tipo || 'whatsapp';
      openModal(`
        ${modalHead(b.isNew ? 'Nuevo botón flotante' : 'Editar botón flotante')}
        <div class="field-row">
          <div class="field"><label>Emoji (opcional)</label><input type="text" id="fe-emoji" value="${esc(b.emoji||'')}" maxlength="4" placeholder="🎉"></div>
          <div class="field"><label>Texto del botón</label><input type="text" id="fe-texto" value="${esc(b.texto||'')}" placeholder="Ej: Descuentos"></div>
        </div>
        <div class="field"><label>Acción al tocarlo</label>
          <div class="field-chips" id="fe-tipo-chips">${FB_TIPOS.map(t => `<button type="button" class="field-chip ${t.id===tipoSel?'sel':''}" data-tipo="${t.id}">${t.label}</button>`).join('')}</div>
        </div>
        <div id="fe-valor-box">${fbValorHtml(tipoSel, b.valor)}</div>
        <div class="err-msg" id="fe-err"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="fe-back">Volver</button>
          <button class="btn btn-primary" id="fe-ok">Listo</button>
        </div>
      `);
      document.querySelectorAll('#fe-tipo-chips .field-chip').forEach(ch => {
        ch.onclick = () => {
          document.querySelectorAll('#fe-tipo-chips .field-chip').forEach(x => x.classList.remove('sel'));
          ch.classList.add('sel');
          tipoSel = ch.getAttribute('data-tipo');
          document.getElementById('fe-valor-box').innerHTML = fbValorHtml(tipoSel, '');
        };
      });
      document.getElementById('fe-back').onclick = () => {
        if (b.isNew) fbs = fbs.filter(x => x.id !== b.id);
        mode = 'canvas'; paint();
      };
      document.getElementById('fe-ok').onclick = () => {
        const texto = document.getElementById('fe-texto').value.trim();
        if (!texto){ document.getElementById('fe-err').textContent = 'Poné un texto para el botón.'; return; }
        const vEl = document.getElementById('fe-valor');
        const valor = vEl ? vEl.value.trim() : '';
        if (tipoSel !== 'personalizado' && !valor){ document.getElementById('fe-err').textContent = 'Completá la acción del botón.'; return; }
        b.texto = texto;
        b.emoji = document.getElementById('fe-emoji').value.trim();
        b.tipo = tipoSel;
        b.valor = valor;
        delete b.isNew;
        mode = 'canvas'; paint();
      };

    } else {
      const el = elementos.find(x => x.id === editingId);
      if (!el){ mode = 'canvas'; paint(); return; }
      openModal(`
        ${modalHead('Editar texto')}
        <div class="field"><label>Texto</label><textarea id="et-texto">${esc(el.texto)}</textarea>
          <div class="hint">Presioná Enter adentro del texto para forzar un salto de línea exactamente donde quieras.</div>
        </div>
        <div class="field-row">
          <div class="field"><label>Color</label><input type="color" id="et-color" value="${el.color||'#f3fff8'}" style="height:42px; padding:4px;"></div>
          <div class="field"><label>Estilo</label>
            <div class="field-chips">
              <button type="button" class="field-chip ${!el.bold?'sel':''}" data-bold="0">Normal</button>
              <button type="button" class="field-chip ${el.bold?'sel':''}" data-bold="1">Negrita</button>
            </div>
          </div>
        </div>
        <div class="field"><label><input type="checkbox" id="et-pill" ${el.pill?'checked':''} style="width:auto; margin-right:6px; vertical-align:middle;">Mostrarlo como cartelito destacado (para ofertas)</label></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="et-back">Volver</button>
          <button class="btn btn-primary" id="et-ok">Listo</button>
        </div>
      `);
      let boldVal = !!el.bold;
      document.querySelectorAll('[data-bold]').forEach(b => {
        b.onclick = () => { document.querySelectorAll('[data-bold]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); boldVal = b.getAttribute('data-bold') === '1'; };
      });
      document.getElementById('et-back').onclick = () => { mode = 'canvas'; paint(); };
      document.getElementById('et-ok').onclick = () => {
        el.texto = document.getElementById('et-texto').value.trim() || 'Texto';
        el.color = document.getElementById('et-color').value;
        el.bold = boldVal;
        el.pill = document.getElementById('et-pill').checked;
        mode = 'canvas'; paint();
      };
    }
  }

  paint();
}

/* ---- Compartir página por WhatsApp ---- */
function shareLink(){
  let base = SITE_URL_DEFAULT + '/';
  try {
    const h = location.hostname || '';
    if (/^https?:$/.test(location.protocol) && h && !/(^|\.)claude\.ai$|claudeusercontent|localhost|127\.0\.0\.1/.test(h)){
      base = location.origin + location.pathname.replace(/index\.html$/, '');
    }
  } catch(e){}
  if (!/\/$/.test(base)) base += '/';
  return base + '?cliente=1';
}
function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  return new Promise((resolve, reject) => {
    try {
      const t = document.createElement('textarea');
      t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
      resolve();
    } catch(e){ reject(e); }
  });
}
function openCompartirModal(){
  const link = shareLink();
  const msg = '¡Hola! 👋 Te comparto la página de Puelo Neón 💚\n\nMirá nuestros carteles de neón LED, alquilá el que más te guste o pedí el tuyo personalizado:';
  openModal(`
    ${modalHead('Compartir página')}
    <p style="margin:-6px 0 14px; font-size:12.5px; color:var(--ink-dim);">Mandá el enlace a tus clientes. Al abrirlo entran directo a la galería (sin ver el acceso de administrador).</p>
    <div class="field"><label>Enlace de la página</label><input type="text" id="sh-link" value="${esc(link)}"></div>
    <div class="field"><label>Mensaje</label><textarea id="sh-msg" style="min-height:120px;">${esc(msg)}</textarea>
      <div class="hint">El enlace se agrega al final del mensaje. Al tocar el botón elegís a quién mandarlo desde WhatsApp.</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="sh-copy">Copiar enlace</button>
      <button class="btn btn-wa" id="sh-wa">${ICON.wa}Enviar por WhatsApp</button>
    </div>
  `);
  document.getElementById('sh-copy').onclick = () => {
    copyText(document.getElementById('sh-link').value.trim())
      .then(() => showToast('Enlace copiado'))
      .catch(() => showToast('No se pudo copiar, seleccionalo a mano.'));
  };
  document.getElementById('sh-wa').onclick = () => {
    const text = document.getElementById('sh-msg').value.trim() + '\n\n' + document.getElementById('sh-link').value.trim();
    window.open(waLink('', text), '_blank', 'noopener');
  };
}

function openPortadaImagenesModal(){
  const renderInner = () => {
    const p = getPortada();
    const fondos = p.fondos || [];
    openModal(`
      ${modalHead('Imágenes de fondo')}
      <p style="margin:-6px 0 14px; font-size:12.5px; color:var(--ink-dim);">Estas fotos van pasando de fondo, detrás del logo, en la página que ven tus clientes.</p>
      ${fondos.length ? `<div class="estilo-grid" style="margin-bottom:16px;">
        ${fondos.map((src, i) => `
          <div class="estilo-opt" style="cursor:default;">
            <div class="thumb"><img src="${src}"></div>
            <button type="button" class="btn btn-danger btn-sm" style="width:100%; border-radius:0;" data-fondo-del="${i}">Quitar</button>
          </div>
        `).join('')}
      </div>` : ''}
      <label class="btn btn-ghost btn-block" for="fondo-imagen">${ICON.upload}Agregar foto</label>
      <input type="file" accept="image/*" id="fondo-imagen" class="visually-hidden">
      <div class="modal-actions">
        <button class="btn btn-primary modal-close" style="flex:1;">Listo</button>
      </div>
    `);
    document.querySelectorAll('[data-fondo-del]').forEach(b => {
      b.onclick = async () => {
        const idx = Number(b.getAttribute('data-fondo-del'));
        const cur = getPortada();
        const nf = (cur.fondos||[]).slice();
        nf.splice(idx,1);
        await patchDoc('config','portada', { fondos: nf });
        renderInner();
      };
    });
    document.getElementById('fondo-imagen').onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await readImageAsDataURL(file, 1200, 0.72);
        const cur = getPortada();
        const nf = (cur.fondos||[]).concat([dataUrl]);
        await patchDoc('config','portada', { fondos: nf });
        renderInner();
      } catch(err){ console.error(err); showToast('No se pudo procesar la imagen.'); }
    };
  };
  renderInner();
}

    } catch(e){ console.error(e); showToast('No se pudo procesar la imagen.'); }
  };
  const t2 = document.getElementById('foto-cliente-input');
  if (t2) t2.onchange = async () => {
    const file = t2.files && t2.files[0];
    if (!file) return;
    try {
      const dataUrl = await readImageAsDataURL(file, 1100, 0.75);
      await writeDoc('fotos_clientes', uid(), { imagen: dataUrl, creadoEn: todayStr() });
      showToast('Foto agregada');
    } catch(e){ console.error(e); showToast('No se pudo procesar la imagen.'); }
  };
}

/* ============================== PRESUPUESTOS / VENTAS ============================== */
function renderVentas(){
  const items = arr('ventas').sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const pendientes = items.filter(s=>s.estado==='pendiente').length;
  const pagadas = items.filter(s=>s.estado==='pagado').length;
  const totalHistorico = items.reduce((a,s)=>a+Number(s.total||0),0);
  const saldoTotal = items.reduce((a,s)=> a + (s.estado!=='rechazado' ? Math.max(Number(s.total||0)-Number(s.abono||0),0) : 0), 0);
  return `
    <div class="page-head">
      <div><h1>Presupuestos</h1><p class="sub">Armá el presupuesto y se descuenta el stock automáticamente.</p></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost" data-open="presupuesto-ajustes">${ICON.money}Ajustes</button>
        <button class="btn btn-primary" data-open="venta-nueva">${ICON.plus}Nuevo presupuesto</button>
      </div>
    </div>
    <div class="grid-stats">
      <div class="card stat"><div class="n" style="font-size:20px;">${pendientes}</div><div class="l">Pendientes</div></div>
      <div class="card stat"><div class="n" style="font-size:20px;">${pagadas}</div><div class="l">Pagadas</div></div>
      <div class="card stat"><div class="n" style="font-size:20px;">${fmtMoney(totalHistorico)}</div><div class="l">Total histórico</div></div>
      <div class="card stat"><div class="n" style="font-size:20px; color:var(--warn);">${fmtMoney(saldoTotal)}</div><div class="l">Saldo por cobrar</div></div>
    </div>
    ${items.length===0 ? `<div class="empty"><b>Creá tu primer presupuesto</b>Se descuenta el stock automáticamente al guardarlo.</div>` :
      `<div class="list">${items.map(ventaRow).join('')}</div>`}
  `;
}
function ventaRow(s){
  const c = s.clienteId ? getDoc('clientes', s.clienteId) : null;
  return `<div class="row-card" style="cursor:pointer;" data-open="venta-detalle" data-id="${s.id}">
    <div class="row-avatar" style="background:var(--green-dim); color:var(--green);">${ICON.receipt}</div>
    <div class="row-main">
      <div class="t1">${esc(s.trabajo || (c?c.nombre:'Presupuesto'))}</div>
      <div class="t2">${c?esc(c.nombre):''} · ${fmtDate(s.fecha)} · ${fmtMoney(s.total)}</div>
    </div>
    <span class="pill ${VENTA_ESTADOS[s.estado]||'pill-mute'}">${esc(s.estado)}</span>
  </div>`;
}

function openVentaForm(){
  if (!arr('clientes').length){
    openModal(`${modalHead('Nuevo presupuesto')}<div class="empty"><b>Cargá un cliente primero</b>Necesitás al menos un cliente para armar un presupuesto.</div>
      <div class="modal-actions"><button class="btn btn-primary modal-close" style="flex:1;">Entendido</button></div>`);
    return;
  }
  const cfg = getPresupuestoConfig();

  openModal(`
    ${modalHead('Nuevo presupuesto')}
    <div class="field"><label>Diseño</label><input type="text" id="f-trabajo" placeholder="Ej: Cartel Coca-Cola"></div>
    <div class="field"><label>Cliente</label><select id="f-cliente"><option value="">— seleccionar —</option>${clienteOptions(null)}</select></div>
    <div class="field-row">
      <div class="field"><label>Alto (cm)</label><input type="number" id="f-alto" step="any" value="0"></div>
      <div class="field"><label>Ancho (cm)</label><input type="number" id="f-ancho" step="any" value="0"></div>
    </div>
    <div class="field"><label>Neón (metros)</label><input type="number" id="f-neon" step="any" value="0"></div>
    <div class="field"><label>Observaciones</label><textarea id="f-obs" placeholder="Detalles del trabajo, colores, etc."></textarea></div>
    <div class="card" id="total-breakdown" style="margin:14px 0;"></div>
    <div class="err-msg" id="f-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-primary" id="f-save">Guardar presupuesto</button>
    </div>
  `, { wide: true });

  function recalc(){
    const alto = Number(document.getElementById('f-alto').value)||0;
    const ancho = Number(document.getElementById('f-ancho').value)||0;
    const neon = Number(document.getElementById('f-neon').value)||0;
    const b = computePresupuestoTotal(alto, ancho, neon, cfg);
    document.getElementById('total-breakdown').innerHTML = `
      <div class="breakdown-row"><span>Acrílico (${b.areaM2.toFixed(2)} m² × ${fmtMoney(cfg.precioAcrilicoM2)})</span><span>${fmtMoney(b.costoAcrilico)}</span></div>
      <div class="breakdown-row"><span>Neón (${neon} m × ${fmtMoney(cfg.precioNeonMetro)})</span><span>${fmtMoney(b.costoNeon)}</span></div>
      <div class="breakdown-row"><span>Fuente</span><span>${fmtMoney(b.costoFuente)}</span></div>
      <div style="border-top:1px solid var(--panel-border-soft); margin:8px 0;"></div>
      <div class="breakdown-row" style="font-weight:800; color:var(--white); font-size:15px;"><span>Total presupuesto</span><span style="color:var(--green);">${fmtMoney(b.total)}</span></div>
    `;
  }
  ['f-alto','f-ancho','f-neon'].forEach(fid => document.getElementById(fid).oninput = recalc);
  recalc();

  document.getElementById('f-save').onclick = async () => {
    const clienteId = document.getElementById('f-cliente').value;
    if (!clienteId){ document.getElementById('f-err').textContent = 'Elegí un cliente.'; return; }
    const alto = Number(document.getElementById('f-alto').value)||0;
    const ancho = Number(document.getElementById('f-ancho').value)||0;
    const neon = Number(document.getElementById('f-neon').value)||0;
    if (alto <= 0 || ancho <= 0){ document.getElementById('f-err').textContent = 'Cargá el alto y el ancho del cartel.'; return; }
    const b = computePresupuestoTotal(alto, ancho, neon, cfg);
    const cliente = getDoc('clientes', clienteId);
    const data = {
      clienteId, clienteNombre: cliente.nombre,
      trabajo: document.getElementById('f-trabajo').value.trim(),
      fecha: todayStr(),
      alto, ancho, neonMetros: neon,
      areaM2: b.areaM2, costoAcrilico: b.costoAcrilico, costoNeon: b.costoNeon, costoFuente: b.costoFuente,
      total: b.total,
      estado: 'pendiente', abono: 0, observaciones: document.getElementById('f-obs').value.trim(),
    };
    await writeDoc('ventas', uid(), data);
    closeModal(); render();
    showToast('Presupuesto creado');
  };
}

function buildVentaText(s, c){
  const esNuevo = s.alto != null;
  let txt = `*PUELO NEÓN* 💚\n${s.trabajo ? ('Diseño: '+s.trabajo+'\n') : ''}Presupuesto para: ${c?c.nombre:'Cliente'}\nFecha: ${fmtDate(s.fecha)}\n\n`;
  if (esNuevo){
    txt += `• Medidas: ${s.alto} x ${s.ancho} cm\n`;
    if (s.neonMetros) txt += `• Neón: ${s.neonMetros} metros\n`;
  }
  txt += `\n*Total: ${fmtMoney(s.total)}*\n`;
  if (s.observaciones) txt += `\nObservaciones: ${s.observaciones}\n`;
  txt += `\nEstado: ${String(s.estado||'').toUpperCase()}`;
  return txt;
}

      </select>

    <div class="field"><label>Observaciones</label><textarea id="vd-obs">${esc(s.observaciones||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-wa" id="vd-wa">${ICON.wa}WhatsApp</button>

/* ============================== GANANCIAS ============================== */
function renderGanancias(){
  const months = {};
  arr('ventas').forEach(s => {
    const mk = monthKey(s.fecha);
    months[mk] = months[mk] || { ingresos: 0, gastos: 0 };
    months[mk].ingresos += (s.estado==='pagado' ? Number(s.total||0) : Number(s.abono||0));
  });
  arr('gastos').forEach(g => {
    const mk = monthKey(g.fecha);
    months[mk] = months[mk] || { ingresos: 0, gastos: 0 };
    months[mk].gastos += Number(g.monto||0);
  });
  const keys = Object.keys(months).sort().reverse();
  return `
    <div class="page-head">
      <div><h1>Ganancias mensuales</h1><p class="sub">Ingresos de presupuestos menos gastos registrados, por mes.</p></div>
    </div>
    ${keys.length===0 ? `<div class="empty"><b>Todavía no hay datos suficientes</b>Van a aparecer acá en cuanto cargues presupuestos y gastos.</div>` :
      `<div class="list">${keys.map(mk => {
        const d = months[mk];
        const g = d.ingresos - d.gastos;
        return `<div class="row-card">
          <div class="row-main">
            <div class="t1">${monthLabel(mk)}</div>
            <div class="t2">ingresos ${fmtMoney(d.ingresos)} · gastos ${fmtMoney(d.gastos)}</div>
          </div>
          <span class="price" style="color:${g<0?'var(--danger)':'var(--green)'}; font-weight:800; font-size:16px;">${fmtMoney(g)}</span>
        </div>`;
      }).join('')}</div>`}
  `;
}

/* ============================== DISPONIBILIDAD (para la galería) ============================== */
function cartelAvailability(id){
  const cartel = getDoc('carteles', id);
  if (!cartel) return { disponible: false, dias: null, fecha: null };
  if (cartel.estado === 'disponible') return { disponible: true, dias: 0, fecha: null };
  const alq = arr('alquileres').find(a => a.estado === 'activo' && a.cartelId === id);
  if (alq) return { disponible: false, dias: Math.max(0, daysUntil(alq.fechaRetiro)), fecha: alq.fechaRetiro };
  const sub = arr('suscripciones').find(s => s.estado === 'activa' && s.cartelActualId === id);
  if (sub) return { disponible: false, dias: Math.max(0, daysUntil(sub.proximoCambio)), fecha: sub.proximoCambio };
  return { disponible: false, dias: null, fecha: null };
}
