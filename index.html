<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puelo Neón · Alquiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #070c09;
    --bg-grad: radial-gradient(1200px 700px at 12% -10%, #0d2115 0%, #070c09 55%), radial-gradient(900px 600px at 110% 10%, #0a1a12 0%, #070c09 60%);
    --panel: #0c1512;
    --panel-2: #0f1a15;
    --panel-border: rgba(83, 255, 168, 0.16);
    --panel-border-soft: rgba(83, 255, 168, 0.08);
    --green: #4dffa3;
    --green-soft: #2fcf87;
    --green-dim: #143a29;
    --white: #f3fff8;
    --ink: #e9fbf1;
    --ink-dim: #8fab9d;
    --ink-faint: #5c7367;
    --danger: #ff7a63;
    --danger-dim: #3a1f19;
    --warn: #ffcf6b;
    --warn-dim: #3a3319;
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    --font-display: 'Syne', 'Manrope', sans-serif;
    --font-body: 'Manrope', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg-grad), var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  ::selection { background: var(--green-dim); color: var(--white); }
  a { color: inherit; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Layout ---------- */
  #app { display: flex; min-height: 100vh; min-height: 100dvh; }

  .sidebar {
    width: 250px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #0a1310 0%, #060a08 100%);
    border-right: 1px solid var(--panel-border-soft);
    display: flex;
    flex-direction: column;
    padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 6px 22px;
  }
  .brand img { width: 40px; height: auto; filter: drop-shadow(0 0 10px rgba(77,255,163,.35)); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text b { font-family: var(--font-display); font-size: 15px; letter-spacing: .01em; color: var(--white); }
  .brand-text span { font-size: 11px; color: var(--ink-faint); font-weight: 600; }

  nav.mainnav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .navitem {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: var(--radius-s);
    color: var(--ink-dim); font-weight: 600; font-size: 14px;
    cursor: pointer; border: 1px solid transparent; background: none;
    text-align: left; width: 100%;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .navitem svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
  .navitem:hover { background: rgba(77,255,163,.06); color: var(--ink); }
  .navitem.active {
    background: rgba(77,255,163,.1);
    border-color: var(--panel-border);
    color: var(--white);
  }
  .navitem.active svg { opacity: 1; filter: drop-shadow(0 0 4px rgba(77,255,163,.5)); }
  .navitem .badge {
    margin-left: auto; background: var(--danger); color: #1a0e0a; font-size: 10.5px;
    font-weight: 800; border-radius: 20px; padding: 1px 6px; min-width: 18px; text-align: center;
  }

  .sidebar-foot { padding: 12px 10px 0; font-size: 11px; color: var(--ink-faint); border-top: 1px solid var(--panel-border-soft); margin-top: 10px; }
  .sidebar-foot .dot { color: var(--green); }

  main#content {
    flex: 1; min-width: 0; padding: 28px 34px 60px;
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
  }
  .content-inner { max-width: 1080px; margin: 0 auto; }

  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .page-head h1 {
    font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; color: var(--white);
    letter-spacing: -.01em;
  }
  .page-head p.sub { margin: 0; color: var(--ink-dim); font-size: 14px; max-width: 46ch; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    border-radius: var(--radius-s); font-weight: 700; font-size: 13.5px;
    padding: 10px 16px; cursor: pointer; border: 1px solid transparent;
    transition: transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn-primary {
    background: var(--green); color: #06170f; border-color: var(--green);
    box-shadow: 0 0 0px rgba(77,255,163,0);
  }
  .btn-primary:hover { box-shadow: 0 0 18px rgba(77,255,163,.45); transform: translateY(-1px); }
  .btn-ghost {
    background: rgba(255,255,255,.02); color: var(--ink); border-color: var(--panel-border);
  }
  .btn-ghost:hover { background: rgba(77,255,163,.07); border-color: var(--green-soft); }
  .btn-danger { background: transparent; color: var(--danger); border-color: rgba(255,122,99,.35); }
  .btn-danger:hover { background: rgba(255,122,99,.1); }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn-wa { background: #12321f; color: #7dffb0; border-color: rgba(77,255,163,.3); }
  .btn-wa:hover { background: #16402a; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .btn-block { width: 100%; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--panel-border); color: var(--ink-dim); cursor: pointer;
  }
  .iconbtn:hover { color: var(--white); border-color: var(--green-soft); background: rgba(77,255,163,.06); }
  .iconbtn svg { width: 15px; height: 15px; }

  /* ---------- Cards / panels ---------- */
  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--panel-border-soft);
    border-radius: var(--radius-m);
    padding: 18px 18px;
  }
  .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat { padding: 16px 16px; }
  .stat .n { font-family: var(--font-display); font-size: 30px; color: var(--white); line-height: 1; }
  .stat .l { color: var(--ink-dim); font-size: 12.5px; margin-top: 7px; font-weight: 600; }
  .stat.glow .n { color: var(--green); text-shadow: 0 0 16px rgba(77,255,163,.45); }

  .section-title {
    font-family: var(--font-display); font-size: 15px; color: var(--white);
    margin: 30px 0 12px; display: flex; align-items: center; justify-content: space-between;
  }
  .section-title:first-child { margin-top: 0; }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .empty {
    border: 1px dashed var(--panel-border); border-radius: var(--radius-m);
    padding: 30px 20px; text-align: center; color: var(--ink-dim); font-size: 13.5px;
  }
  .empty b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 14.5px; }

  /* reminder row */
  .reminder {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: var(--panel-2); border: 1px solid var(--panel-border-soft); border-radius: var(--radius-s);
  }
  .reminder .dotstat { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .reminder .body { flex: 1; min-width: 0; }
  .reminder .ttl { font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .reminder .sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .reminder .when { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .sev-urgent .dotstat, .sev-urgent .when { background-color: var(--danger); color: var(--danger); }
  .sev-soon .dotstat, .sev-soon .when { background-color: var(--warn); color: var(--warn); }
  .sev-ok .dotstat, .sev-ok .when { background-color: var(--green); color: var(--green); }

  /* Client / rental / sub rows */
  .row-card {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--panel-2); border: 1px solid var(--panel-border-soft); border-radius: var(--radius-m);
  }
  .row-avatar {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    background: var(--green-dim); color: var(--green); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-main .t1 { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .row-main .t2 { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: .01em; border: 1px solid transparent;
  }
  .pill-green { background: rgba(77,255,163,.12); color: var(--green); border-color: rgba(77,255,163,.28); }
  .pill-warn { background: rgba(255,207,107,.12); color: var(--warn); border-color: rgba(255,207,107,.28); }
  .pill-danger { background: rgba(255,122,99,.12); color: var(--danger); border-color: rgba(255,122,99,.28); }
  .pill-mute { background: rgba(255,255,255,.04); color: var(--ink-dim); border-color: var(--panel-border-soft); }

  /* Catalog grid */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .cat-card {
    background: var(--panel-2); border: 1px solid var(--panel-border-soft); border-radius: var(--radius-m);
    padding: 16px; display: flex; flex-direction: column; gap: 8px; position: relative;
  }
  .cat-card .swatch {
    width: 100%; height: 62px; border-radius: 10px; margin-bottom: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .02em;
    border: 1px solid var(--panel-border-soft);
  }
  .cat-card h4 { margin: 0; font-size: 15px; color: var(--white); font-family: var(--font-display); }
  .cat-card .theme { font-size: 11.5px; color: var(--green-soft); font-weight: 700; text-transform: none; }
  .cat-card p { margin: 0; font-size: 12.5px; color: var(--ink-dim); line-height: 1.45; flex: 1; }
  .cat-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .cat-card .price { font-weight: 800; color: var(--ink); font-size: 13.5px; }
  .cat-card .cardacts { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; }

  .filterbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .chip {
    padding: 6px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--panel-border); background: transparent; color: var(--ink-dim);
  }
  .chip.active { background: rgba(77,255,163,.12); border-color: var(--green-soft); color: var(--green); }
  .searchbox {
    display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 7px 13px; flex: 1; min-width: 160px; max-width: 280px;
  }
  .searchbox svg { width: 14px; height: 14px; color: var(--ink-faint); flex-shrink: 0; }
  .searchbox input { background: none; border: none; outline: none; color: var(--ink); font-size: 13px; width: 100%; }
  .searchbox input::placeholder { color: var(--ink-faint); }

  /* ---------- Forms / Modal ---------- */
  #modal-root:empty { display: none; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(2,6,4,.72); backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    z-index: 100; overflow-y: auto;
  }
  .modal {
    background: linear-gradient(180deg, #0f1c16, #0a130f); border: 1px solid var(--panel-border);
    border-radius: var(--radius-l); width: 100%; max-width: 460px; padding: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(77,255,163,.04);
  }
  .modal.wide { max-width: 620px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-head h3 { margin: 0; font-family: var(--font-display); font-size: 18px; color: var(--white); }
  .modal-close { background: none; border: none; color: var(--ink-dim); cursor: pointer; padding: 4px; border-radius: 6px; }
  .modal-close:hover { color: var(--white); background: rgba(255,255,255,.06); }
  .modal-close svg { width: 18px; height: 18px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-dim); margin-bottom: 6px; }
  .field .hint { font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number],
  .field input[type=date], .field select, .field textarea {
    width: 100%; background: #08110d; border: 1px solid var(--panel-border); color: var(--ink);
    border-radius: 9px; padding: 10px 12px; font-size: 13.5px; outline: none;
    transition: border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green-soft); }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .field-chip {
    padding: 7px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--panel-border); background: transparent; color: var(--ink-dim);
  }
  .field-chip.sel { background: rgba(77,255,163,.14); border-color: var(--green-soft); color: var(--green); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; }
  .err-msg { color: var(--danger); font-size: 12px; margin-top: 4px; min-height: 14px; }

  /* toast */
  #toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(12px);
    background: #0f2318; border: 1px solid rgba(77,255,163,.35); color: var(--white);
    padding: 11px 18px; border-radius: 30px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 200;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    display: flex; align-items: center; gap: 8px;
  }
  #toast svg { width: 15px; height: 15px; color: var(--green); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* mobile bottom nav */
  .bottomnav { display: none; }

  @media (max-width: 900px) {
    #app { flex-direction: column; }
    .sidebar {
      position: sticky; top: 0; height: auto; width: 100%; flex-direction: row;
      align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; border-right: none;
      border-bottom: 1px solid var(--panel-border-soft); z-index: 50;
    }
    .brand { padding: 0; }
    nav.mainnav, .sidebar-foot { display: none; }
    main#content { padding: 20px 16px calc(90px + env(safe-area-inset-bottom, 0px)); }
    .grid-stats { grid-template-columns: repeat(2, 1fr); }
    .field-row { grid-template-columns: 1fr; }
    .bottomnav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: #060a08ee; backdrop-filter: blur(8px); border-top: 1px solid var(--panel-border-soft);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
      justify-content: space-around;
    }
    .bottomnav button {
      background: none; border: none; color: var(--ink-faint); display: flex; flex-direction: column;
      align-items: center; gap: 3px; font-size: 9.5px; font-weight: 700; padding: 4px 6px; position: relative;
    }
    .bottomnav button svg { width: 19px; height: 19px; }
    .bottomnav button.active { color: var(--green); }
    .bottomnav button .bnbadge {
      position: absolute; top: -2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
    }
  }
  @media (max-width: 520px) {
    .grid-stats { grid-template-columns: repeat(2, 1fr); }
    .page-head { flex-direction: column; }
    .page-head .btn { width: 100%; }
  }

  /* ---------- Screens: gate / client gallery / admin ---------- */
  #gate-screen, #client-screen { display: none; }
  body[data-screen="gate"] #gate-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 24px 16px;
  }
  body[data-screen="client"] #client-screen { display: block; min-height: 100vh; padding-bottom: 50px; }
  body:not([data-screen="admin"]) #app { display: none !important; }
  body:not([data-screen="admin"]) .bottomnav { display: none !important; }
  body[data-screen="admin"] #app { display: flex; }

  .gate-wrap { max-width: 420px; margin: 0 auto; text-align: center; }
  .gate-logo { width: 140px; margin: 0 auto 20px; filter: drop-shadow(0 0 18px rgba(77,255,163,.3)); }
  .gate-title { font-family: var(--font-display); font-size: 30px; color: var(--white); margin: 0 0 6px; }
  .gate-sub { color: var(--ink-dim); margin: 0 0 30px; font-size: 14px; }
  .gate-btns { display: flex; flex-direction: column; gap: 14px; }
  .gate-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 22px;
    border-radius: var(--radius-m); border: 1px solid var(--panel-border); background: var(--panel-2);
    color: var(--white); font-family: var(--font-display); font-size: 16px; font-weight: 700;
    cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .gate-btn:hover { border-color: var(--green-soft); box-shadow: 0 0 24px rgba(77,255,163,.16); transform: translateY(-1px); }
  .gate-btn small { font-family: var(--font-body); font-weight: 600; color: var(--ink-dim); font-size: 11.5px; }
  .gate-btn-ico { font-size: 27px; line-height: 1; }

  .gallery-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 8px; max-width: 960px; margin: 0 auto;
  }
  .gallery-logo { width: 92px; height: auto; filter: drop-shadow(0 0 10px rgba(77,255,163,.3)); }
  .gallery-hero { text-align: center; padding: 10px 20px 26px; max-width: 640px; margin: 0 auto; }
  .gallery-hero h1 { font-family: var(--font-display); font-size: 28px; color: var(--white); margin: 0 0 8px; }
  .gallery-hero p { color: var(--ink-dim); font-size: 15px; margin: 0; }
  .gallery-section { max-width: 960px; margin: 0 auto; padding: 6px 0 22px; }
  .gallery-section h2 {
    font-family: var(--font-display); font-size: 16px; margin: 0 0 12px; padding: 0 20px;
  }
  .carousel {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 2px 20px 10px; -webkit-overflow-scrolling: touch;
  }
  .gallery-card {
    flex: 0 0 220px; scroll-snap-align: start; background: var(--panel-2);
    border: 1px solid var(--panel-border-soft); border-radius: var(--radius-m);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .gallery-swatch {
    height: 108px; display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 10px;
    border-bottom: 1px solid var(--panel-border-soft);
  }
  .gallery-card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .gallery-card-body h4 { margin: 0; font-family: var(--font-display); color: var(--white); font-size: 15px; }
  .gallery-card-body p { margin: 0; font-size: 12px; color: var(--ink-dim); line-height: 1.45; min-height: 30px; flex: 1; }

  /* ---------- Image picker ---------- */
  .imgpicker-row { display: flex; align-items: center; gap: 12px; }
  .imgpicker-box {
    width: 84px; height: 84px; border-radius: 10px; border: 1px dashed var(--panel-border);
    background: #08110d; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  }
  .imgpicker-box svg { width: 26px; height: 26px; }
  .imgpicker-actions { display: flex; flex-direction: column; gap: 6px; }
  .imgpicker-actions label.btn { cursor: pointer; }

  /* ---------- Categorías manager ---------- */
  .tema-manage-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--panel-border-soft); }
  .tema-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .tema-manage-row .nm { flex: 1; font-size: 13px; font-weight: 700; color: var(--ink); }

  /* ---------- Personalizado ---------- */
  .cta-personalizado {
    display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: var(--radius-m);
    background: linear-gradient(120deg, rgba(77,255,163,.12), rgba(77,255,163,.02));
    border: 1px solid var(--panel-border); margin: 6px 20px 26px; max-width: 920px; margin-left:auto; margin-right:auto;
  }
  .cta-personalizado .ico { font-size: 30px; flex-shrink: 0; }
  .cta-personalizado .txt { flex: 1; }
  .cta-personalizado h3 { margin: 0 0 3px; font-family: var(--font-display); color: var(--white); font-size: 16px; }
  .cta-personalizado p { margin: 0; color: var(--ink-dim); font-size: 12.5px; }
  .estilo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; margin: 4px 0 6px; }
  .estilo-opt { border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--panel-2); text-align: center; }
  .estilo-opt.sel { border-color: var(--green-soft); box-shadow: 0 0 0 1px var(--green-soft) inset; }
  .estilo-opt .thumb { height: 70px; display: flex; align-items: center; justify-content: center; background: #08110d; }
  .estilo-opt .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .estilo-opt .thumb svg { width: 22px; height: 22px; color: var(--ink-faint); }
  .estilo-opt .lbl { font-size: 10.5px; font-weight: 700; padding: 6px 4px; color: var(--ink-dim); line-height: 1.25; }
  .estilo-opt.sel .lbl { color: var(--green); }

  .gallery-social { display: flex; justify-content: center; gap: 12px; padding: 8px 20px 30px; }
  .gallery-social a {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel-2);
    display: flex; align-items: center; justify-content: center; color: var(--ink-dim); text-decoration: none;
  }
  .gallery-social a svg { width: 19px; height: 19px; }
  .gallery-social a:hover { color: var(--green); border-color: var(--green-soft); }
</style>
</head>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function addDays(s, days){ const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+Number(days)); return d.toISOString().slice(0,10); }
function addMonths(s, months){ const d = new Date(s+'T00:00:00'); d.setMonth(d.getMonth()+Number(months)); return d.toISOString().slice(0,10); }
function daysUntil(s){
  if(!s) return 9999;

function supabaseConfigured(){
  return SUPABASE_URL && SUPABASE_ANON_KEY &&
    SUPABASE_URL.indexOf('TU_SUPABASE') === -1 && SUPABASE_ANON_KEY.indexOf('TU_SUPABASE') === -1 &&

}

async function initData(){
  try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }
  catch(e){ db = null; }

  if (db){
    dbMode = 'cloud';
    let pending = COLS.length;
    COLS.forEach(col => {
      db.collection(col).onSnapshot(
        snap => {
          const map = {};
          snap.docs.forEach(d => { if (d.exists) map[d.id] = d.data(); });
          state[col] = map;
          if (pending > 0){ pending--; if (pending === 0) afterFirstLoad(); }
          render();
        },
        err => {
          console.error('db error on', col, err);
          if (dbMode === 'cloud'){ dbMode = 'local'; loadLocalAll(); afterFirstLoad(); render(); }
        }
      );
    });
  } else if (supabaseConfigured()){
    dbMode = 'supabase';
    try { await initSupabase(); }
    catch(e){ console.error('supabase init failed', e); dbMode = 'local'; loadLocalAll(); afterFirstLoad(); render(); }
  } else {
    dbMode = 'local';
    loadLocalAll();
    afterFirstLoad();
    render();
  }
}

async function initSupabase(){
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  for (const col of COLS){
    const { data, error } = await sbClient.from(SUPABASE_TABLE).select('id,data').eq('collection', col);
    if (error) throw error;
    const map = {};
    (data || []).forEach(r => { map[r.id] = r.data; });
    state[col] = map;
  }
  afterFirstLoad();
  render();

  sbClient.channel('puelo_records_sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: SUPABASE_TABLE }, payload => {
      const row = (payload.new && Object.keys(payload.new).length) ? payload.new : payload.old;
      if (!row || COLS.indexOf(row.collection) === -1) return;
      if (payload.eventType === 'DELETE') delete state[row.collection][row.id];
      else state[row.collection][row.id] = row.data;
      render();
    })
    .subscribe();
}

function loadLocalAll(){
  COLS.forEach(col => {
    try {
      const raw = localStorage.getItem('pueloneon_'+col);
      state[col] = raw ? JSON.parse(raw) : {};
    } catch(e){ state[col] = {}; }
  });
}
function persistLocal(col){
  try { localStorage.setItem('pueloneon_'+col, JSON.stringify(state[col])); } catch(e){}
}

async function writeDoc(col, id, data){
  if (dbMode === 'cloud' && db){
    try { await db.collection(col).doc(id).set(data); }
    catch(e){ console.error('write failed', col, id, e); showToast('No se pudo guardar. Probá de nuevo.'); throw e; }
  } else if (dbMode === 'supabase' && sbClient){
    try {
      const { error } = await sbClient.from(SUPABASE_TABLE)
        .upsert({ collection: col, id: id, data: data, updated_at: new Date().toISOString() }, { onConflict: 'collection,id' });
      if (error) throw error;
      state[col][id] = data;
      render();
    } catch(e){ console.error('write failed', col, id, e); showToast('No se pudo guardar. Probá de nuevo.'); throw e; }
  } else {
    state[col][id] = data;
    persistLocal(col);
    render();
  }
}
async function patchDoc(col, id, patch){
  const current = getDoc(col, id) || {};
  const merged = Object.assign({}, current, patch);
  delete merged.id;
  return writeDoc(col, id, merged);
}
async function deleteDoc(col, id){
  if (dbMode === 'cloud' && db){
    try { await db.collection(col).doc(id).delete(); }
    catch(e){ console.error('delete failed', col, id, e); showToast('No se pudo eliminar.'); throw e; }
  } else if (dbMode === 'supabase' && sbClient){
    try {
      const { error } = await sbClient.from(SUPABASE_TABLE).delete().eq('collection', col).eq('id', id);
      if (error) throw error;
      delete state[col][id];
      render();
    } catch(e){ console.error('delete failed', col, id, e); showToast('No se pudo eliminar.'); throw e; }
  } else {
    delete state[col][id];
    persistLocal(col);
    render();
  }
}

/* ---- Compresión de imágenes en el navegador antes de guardarlas ---- */
function readImageAsDataURL(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const isPng = file.type === 'image/png';
        resolve(isPng ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality || 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function bindImagePicker(inputId, previewId, currentValue, onChange){
  let value = currentValue || null;
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);
  function paint(){
    preview.innerHTML = value
      ? `<img src="${value}" style="width:100%;height:100%;object-fit:cover;">`
      : `<span style="color:var(--ink-faint);">${ICON.image}</span>`;
  }
  paint();
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      value = await readImageAsDataURL(file, 900, 0.75);
      paint();
      onChange(value);
    } catch(e){ console.error(e); showToast('No se pudo procesar la imagen.'); }
  };
  return { get: () => value, clear: () => { value = null; paint(); onChange(null); input.value = ''; } };
}

function computeReminders(){
  const out = [];
  arr('alquileres').filter(a => a.estado === 'activo').forEach(a => {
    const d = daysUntil(a.fechaRetiro);
    if (d <= 3){
      out.push({ tipo: 'retiro', dias: d, fecha: a.fechaRetiro, titulo: `Retirar "${a.cartelNombre}"`, sub: `Cliente: ${a.clienteNombre}`, ref: a });
    }
  });
  arr('suscripciones').filter(s => s.estado === 'activa').forEach(s => {
    const dFin = daysUntil(s.fechaFin);
    if (dFin <= 3){
      out.push({ tipo: 'fin_sub', dias: dFin, fecha: s.fechaFin, titulo: `Vence suscripción de ${s.clienteNombre}`, sub: `Plan de ${s.planMeses} ${s.planMeses===1?'mes':'meses'} — finaliza`, ref: s });
    } else {
      const d = daysUntil(s.proximoCambio);
      if (d <= 3){
        out.push({ tipo: 'cambio', dias: d, fecha: s.proximoCambio, titulo: `Cambiar vidriera de ${s.clienteNombre}`, sub: `Cartel actual: ${s.cartelActualNombre||'—'}`, ref: s });
      }
    }
  });
  out.sort((a,b) => a.dias - b.dias);
  return out;
}

  }).join('');
  document.getElementById('mainnav').innerHTML = navHtml;

  const bnHtml = NAV.map(n => {
    const badge = n.id === 'recordatorios' && rem.length ? '<span class="bnbadge"></span>' : '';
    return `<button class="${tab===n.id?'active':''}" data-nav="${n.id}" style="position:relative;">${n.icon}<span>${n.label}</span>${badge}</button>`;
  }).join('');
  document.getElementById('bottomnav').innerHTML = bnHtml;

  document.querySelectorAll('[data-nav]').forEach(b => {
    b.onclick = () => { tab = b.getAttribute('data-nav'); search=''; render(); window.scrollTo({top:0}); };
  });
}

      <div class="card stat"><div class="n">${alquileresActivos.length}</div><div class="l">Alquileres activos</div></div>

function reminderRow(r){

/* ============================== CLIENTES ============================== */
function renderClientes(){
  let list = arr('clientes').sort((a,b)=> (a.nombre||'').localeCompare(b.nombre||''));
  if (search.trim()){
    const q = search.trim().toLowerCase();
    list = list.filter(c => (c.nombre||'').toLowerCase().includes(q) || (c.telefono||'').includes(q));
  }
  return `
    <div class="page-head">
      <div><h1>Clientes</h1><p class="sub">Datos de contacto y seguimiento de cada cliente.</p></div>
      <button class="btn btn-primary" data-open="cliente-nuevo">${ICON.plus}Nuevo cliente</button>
    </div>
    <div class="filterbar">
      <div class="searchbox">${ICON.search}<input type="text" id="searchInput" placeholder="Buscar por nombre o teléfono…" value="${esc(search)}"></div>
    </div>
    ${list.length === 0 ? `<div class="empty"><b>Todavía no hay clientes</b>Agregá el primero para empezar a llevar el control de alquileres.</div>` :
      `<div class="list">${list.map(clienteRow).join('')}</div>`}
  `;
}

function clienteRow(c){
  const alquileres = arr('alquileres').filter(a => a.clienteId === c.id && a.estado==='activo');
  const subs = arr('suscripciones').filter(s => s.clienteId === c.id && s.estado==='activa');
  const initials = (c.nombre||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  let tagHtml = '';
  if (alquileres.length) tagHtml += `<span class="pill pill-green">${alquileres.length} alquiler${alquileres.length>1?'es':''} activo${alquileres.length>1?'s':''}</span> `;
  if (subs.length) tagHtml += `<span class="pill pill-warn">${subs.length} suscripción${subs.length>1?'es':''}</span>`;
  return `<div class="row-card">
    <div class="row-avatar">${esc(initials)}</div>
    <div class="row-main">
      <div class="t1">${esc(c.nombre||'Sin nombre')}</div>
      <div class="t2">${c.telefono ? esc(c.telefono) : 'Sin teléfono'} ${c.direccion ? ' · '+esc(c.direccion) : ''}</div>
      ${tagHtml ? `<div style="margin-top:6px;">${tagHtml}</div>` : ''}
    </div>
    <div class="row-actions">
      ${c.telefono ? `<button class="iconbtn" data-wa-catalog="${c.id}" title="Enviar catálogo por WhatsApp">${ICON.wa}</button>` : ''}
      <button class="iconbtn" data-open="cliente-editar" data-id="${c.id}" title="Editar">${ICON.edit}</button>
      <button class="iconbtn" data-del="clientes" data-id="${c.id}" title="Eliminar">${ICON.trash}</button>
    </div>
  </div>`;
}

/* ============================== CATÁLOGO ============================== */
function renderCatalogo(){

  if (search.trim()){
    const q = search.trim().toLowerCase();

  }
  list.sort((a,b)=> (a.nombre||'').localeCompare(b.nombre||''));
  const temasUsados = ['Todos', ...temaList().map(t=>t.nombre)];

  return `
    <div class="page-head">
      <div><h1>Catálogo de carteles</h1><p class="sub">Tu stock de carteles de neón LED por temática.</p></div>

        <button class="btn btn-ghost" data-open="temas-gestionar">${ICON.catalog}Categorías</button>
        <button class="btn btn-wa" data-share-catalog="1">${ICON.wa}Compartir catálogo</button>
        <button class="btn btn-primary" data-open="cartel-nuevo">${ICON.plus}Nuevo cartel</button>
      </div>
    </div>
    <div class="filterbar">
      <div class="searchbox">${ICON.search}<input type="text" id="searchInput" placeholder="Buscar cartel…" value="${esc(search)}"></div>

    <div class="filterbar" id="chipbar">

function cartelCard(c){
  const color = temaColor(c.tematica);
  const estadoPill = c.estado === 'disponible' ? `<span class="pill pill-green">Disponible</span>` : `<span class="pill pill-warn">Alquilado</span>`;
  const swatch = c.imagen
    ? `<div class="swatch" data-lightbox-cartel="${c.id}" style="background-image:url('${c.imagen}'); background-size:cover; background-position:center; color:#fff; cursor:zoom-in;"></div>`
    : `<div class="swatch" style="background:linear-gradient(135deg, ${color}22, ${color}0d); color:${color}; border-color:${color}33;">${esc(c.tematica||'Otro')}</div>`;
  return `<div class="cat-card">
    <div class="cardacts">
      <button class="iconbtn" data-open="cartel-editar" data-id="${c.id}" title="Editar">${ICON.edit}</button>
      <button class="iconbtn" data-del="carteles" data-id="${c.id}" title="Eliminar">${ICON.trash}</button>
    </div>
    ${swatch}
    <h4>${esc(c.nombre||'Sin nombre')}</h4>
    <p>${esc(c.descripcion||'Sin descripción.')}</p>
    <div class="foot">${estadoPill}<span class="price">${c.precio ? fmtMoney(c.precio) : ''}</span></div>
  </div>`;
}

/* ============================== ALQUILERES ============================== */
function renderAlquileres(){
  const list = arr('alquileres').sort((a,b)=> new Date(a.fechaRetiro) - new Date(b.fechaRetiro));
  const activos = list.filter(a => a.estado === 'activo');
  const finalizados = list.filter(a => a.estado !== 'activo');
  return `
    <div class="page-head">
      <div><h1>Alquileres por tiempo</h1><p class="sub">Entrega y retiro acordado con el cliente para cada cartel.</p></div>
      <button class="btn btn-primary" data-open="alquiler-nuevo">${ICON.plus}Nuevo alquiler</button>
    </div>
    <div class="section-title">Activos</div>
    ${activos.length===0 ? `<div class="empty"><b>No hay alquileres activos</b>Registrá uno nuevo cuando le lleves un cartel a un cliente.</div>` :
      `<div class="list">${activos.map(alquilerRow).join('')}</div>`}
    ${finalizados.length ? `<div class="section-title">Finalizados</div><div class="list">${finalizados.map(alquilerRow).join('')}</div>` : ''}
  `;
}

function alquilerRow(a){
  const d = daysUntil(a.fechaRetiro);
  const sev = a.estado === 'activo' ? severity(d) : null;
  return `<div class="row-card">
    <div class="row-avatar" style="background:var(--green-dim); color:var(--green);">${ICON.rentals}</div>
    <div class="row-main">
      <div class="t1">${esc(a.cartelNombre)} <span style="color:var(--ink-faint); font-weight:600;">→</span> ${esc(a.clienteNombre)}</div>
      <div class="t2">Entrega ${fmtDate(a.fechaEntrega)} · Retiro ${fmtDate(a.fechaRetiro)}${a.monto ? ' · '+fmtMoney(a.monto) : ''}</div>
      ${a.detalles ? `<div class="t2" style="margin-top:2px;">${esc(a.detalles)}</div>` : ''}
    </div>
    ${a.estado === 'activo' ? `<span class="pill ${sev==='urgent'?'pill-danger':sev==='soon'?'pill-warn':'pill-green'}">${severityLabel(d)}</span>` : `<span class="pill pill-mute">Retirado</span>`}
    <div class="row-actions">
      ${a.estado === 'activo' ? `<button class="iconbtn" data-finish-rental="${a.id}" title="Marcar como retirado">${ICON.check}</button>` : ''}
      <button class="iconbtn" data-open="alquiler-editar" data-id="${a.id}" title="Editar">${ICON.edit}</button>
      <button class="iconbtn" data-del="alquileres" data-id="${a.id}" title="Eliminar">${ICON.trash}</button>
    </div>
  </div>`;
}

/* ============================== SUSCRIPCIONES ============================== */
function renderSuscripciones(){
  const list = arr('suscripciones').sort((a,b)=> new Date(a.proximoCambio||a.fechaFin) - new Date(b.proximoCambio||b.fechaFin));
  const activas = list.filter(s => s.estado === 'activa');
  const finalizadas = list.filter(s => s.estado !== 'activa');
  return `
    <div class="page-head">
      <div><h1>Suscripciones</h1><p class="sub">Planes mensuales con cambio de vidriera cada 10 o 15 días.</p></div>
      <button class="btn btn-primary" data-open="sub-nuevo">${ICON.plus}Nueva suscripción</button>
    </div>
    <div class="section-title">Activas</div>
    ${activas.length===0 ? `<div class="empty"><b>No hay suscripciones activas</b>Creá una cuando un cliente elija el plan mensual.</div>` :
      `<div class="list">${activas.map(subRow).join('')}</div>`}
    ${finalizadas.length ? `<div class="section-title">Finalizadas</div><div class="list">${finalizadas.map(subRow).join('')}</div>` : ''}
  `;
}

function subRow(s){
  const dCambio = daysUntil(s.proximoCambio);
  const dFin = daysUntil(s.fechaFin);
  const sev = s.estado === 'activa' ? severity(Math.min(dCambio, dFin)) : null;
  return `<div class="row-card">
    <div class="row-avatar" style="background:var(--green-dim); color:var(--green);">${ICON.subs}</div>
    <div class="row-main">
      <div class="t1">${esc(s.clienteNombre)} <span style="color:var(--ink-faint); font-weight:600;">·</span> plan ${s.planMeses} ${s.planMeses===1?'mes':'meses'}</div>
      <div class="t2">Cartel actual: ${esc(s.cartelActualNombre||'—')} · Cambia cada ${s.frecuenciaDias} días · ${fmtMoney(s.montoTotal)}</div>
      <div class="t2" style="margin-top:2px;">Vigencia: ${fmtDate(s.fechaInicio)} — ${fmtDate(s.fechaFin)}</div>
    </div>
    ${s.estado === 'activa' ?
      `<span class="pill ${sev==='urgent'?'pill-danger':sev==='soon'?'pill-warn':'pill-green'}">${dFin<=dCambio ? 'Fin: '+severityLabel(dFin) : 'Cambio: '+severityLabel(dCambio)}</span>`
      : `<span class="pill pill-mute">Finalizada</span>`}
    <div class="row-actions">
      ${s.estado === 'activa' ? `<button class="iconbtn" data-open="sub-cambiar" data-id="${s.id}" title="Registrar cambio de cartel">${ICON.swap}</button>` : ''}
      ${s.estado === 'activa' ? `<button class="iconbtn" data-finish-sub="${s.id}" title="Finalizar suscripción">${ICON.check}</button>` : ''}
      <button class="iconbtn" data-open="sub-detalle" data-id="${s.id}" title="Ver historial">${ICON.chevr}</button>
      <button class="iconbtn" data-del="suscripciones" data-id="${s.id}" title="Eliminar">${ICON.trash}</button>
    </div>
  </div>`;
}

/* ============================== RECORDATORIOS ============================== */
function renderRecordatorios(){
  const rem = computeReminders();
  return `
    <div class="page-head">
      <div><h1>Avisos</h1><p class="sub">Próximos retiros y cambios de vidriera, ordenados por urgencia.</p></div>
    </div>
    ${rem.length===0 ? `<div class="empty"><b>Sin pendientes por ahora</b>Vas a ver acá los retiros y cambios de cartel de los próximos días.</div>` :
      `<div class="list">${rem.map(reminderRow).join('')}</div>`}
  `;
}

function getConfig(){
  const c = getDoc('config','precios');
  return Object.assign({}, DEFAULT_CONFIG, c || {});
}

function renderPrecios(){
  const cfg = getConfig();
  return `
    <div class="page-head">
      <div><h1>Precios y planes</h1><p class="sub">Estos son los valores que ve el cliente en la galería al reservar un cartel.</p></div>

      <div class="card stat"><div class="n" style="font-size:22px;">${cfg.precioDia?fmtMoney(cfg.precioDia):'Sin definir'}</div><div class="l">Alquiler por día</div></div>
      <div class="card stat"><div class="n" style="font-size:22px;">${cfg.precioMensualFijo?fmtMoney(cfg.precioMensualFijo):'Sin definir'}</div><div class="l">Alquiler mensual fijo</div></div>
      <div class="card stat"><div class="n" style="font-size:22px;">${cfg.precioMembresiaMes?fmtMoney(cfg.precioMembresiaMes):'Sin definir'}</div><div class="l">Membresía · por mes</div></div>

    </div>
    ${cfg.especialDescripcion ? `<p class="sub" style="margin-top:-10px;">${esc(cfg.especialDescripcion)}</p>` : ''}
    <div class="section-title">Cómo se usan</div>
    <div class="empty" style="text-align:left;">
      <b>Por día</b>El cliente elige cuántos días y se multiplica automáticamente por este valor.<br><br>
      <b>Mensual fijo</b>Un cartel fijo durante todo el mes, precio único.<br><br>
      <b>Membresía con cambios</b>El cliente elige duración (1, 3, 6 o 12 meses) y cada cuántos días le cambiamos el cartel (10 o 15); el total es este valor × la cantidad de meses.<br><br>

function openPreciosForm(){
  const cfg = getConfig();
  openModal(`
    ${modalHead('Editar precios')}
    <div class="field"><label>Alquiler por día ($)</label><input type="number" id="p-dia" min="0" step="500" value="${cfg.precioDia||''}"></div>
    <div class="field"><label>Alquiler mensual fijo ($)</label><input type="number" id="p-fijo" min="0" step="500" value="${cfg.precioMensualFijo||''}"></div>
    <div class="field"><label>Membresía con cambios — precio por mes ($)</label><input type="number" id="p-membresia" min="0" step="500" value="${cfg.precioMembresiaMes||''}">
      <div class="hint">El cliente elige duración y frecuencia de cambio; el total se calcula multiplicando por los meses.</div>
    </div>
    <div class="field-row">
      <div class="field"><label>Nombre del plan especial</label><input type="text" id="p-esp-nombre" value="${esc(cfg.especialNombre||'')}"></div>
      <div class="field"><label>Precio especial ($)</label><input type="number" id="p-esp-precio" min="0" step="500" value="${cfg.especialPrecio||''}"></div>
    </div>
    <div class="field"><label>Descripción del plan especial</label><textarea id="p-esp-desc" placeholder="opcional">${esc(cfg.especialDescripcion||'')}</textarea></div>
    <div class="err-msg" id="f-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>

  document.getElementById('f-save').onclick = async () => {
    const data = {
      precioDia: Number(document.getElementById('p-dia').value)||0,
      precioMensualFijo: Number(document.getElementById('p-fijo').value)||0,
      precioMembresiaMes: Number(document.getElementById('p-membresia').value)||0,

      <button class="btn btn-primary modal-close" style="flex:1;" id="es-done">Listo</button>
    </div>
  `);
  const picker = bindImagePicker('es-imagen', 'es-img-preview', e.imagen, async (val) => {
    await patchDoc('estilos', id, { imagen: val });
  });
  document.getElementById('es-img-quitar').onclick = () => picker.clear();
}

/* ============================== DISPONIBILIDAD (para la galería) ============================== */
function cartelAvailability(id){
  const cartel = getDoc('carteles', id);
  if (!cartel) return { disponible: false, dias: null, fecha: null };
  if (cartel.estado === 'disponible') return { disponible: true, dias: 0, fecha: null };
  const alq = arr('alquileres').find(a => a.estado === 'activo' && a.cartelId === id);
  if (alq) return { disponible: false, dias: Math.max(0, daysUntil(alq.fechaRetiro)), fecha: alq.fechaRetiro };
  const sub = arr('suscripciones').find(s => s.estado === 'activa' && s.cartelActualId === id);
  if (sub) return { disponible: false, dias: Math.max(0, daysUntil(sub.proximoCambio)), fecha: sub.proximoCambio };
  return { disponible: false, dias: null, fecha: null };
}

function openAdminPasswordModal(){
  openModal(`
    ${modalHead('Acceso administrador')}
    <div class="field"><label>Contraseña</label><input type="password" id="pw-input" placeholder="••••••••"></div>
    <div class="err-msg" id="pw-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-primary" id="pw-ok">Ingresar</button>
    </div>
  `);
  const tryLogin = () => {
    const val = document.getElementById('pw-input').value;
    if (val === ADMIN_PASSWORD){
      try { localStorage.setItem('pueloneon_admin_auth','ok'); } catch(e){}
      closeModal();
      setScreen('admin');
    } else {
      document.getElementById('pw-err').textContent = 'Contraseña incorrecta.';
    }
  };
  document.getElementById('pw-ok').onclick = tryLogin;
  document.getElementById('pw-input').addEventListener('keydown', ev => { if (ev.key === 'Enter') tryLogin(); });
  setTimeout(() => { const i = document.getElementById('pw-input'); if (i) i.focus(); }, 60);
}

function renderTemaCarousel(tema, list){
  const color = tema.color || '#9fb5aa';
  return `
    <div class="gallery-section">
      <h2 style="color:${color};">${esc(tema.nombre)}</h2>
      <div class="carousel">${list.map(galleryCard).join('')}</div>
    </div>
  `;
}

function galleryCard(c){
  const color = temaColor(c.tematica);
  const av = cartelAvailability(c.id);
  const availLabel = av.disponible ? 'Disponible hoy' : (av.dias == null ? 'Consultar disponibilidad' : `Disponible en ${av.dias} día${av.dias===1?'':'s'}`);
  const swatch = c.imagen
    ? `<div class="gallery-swatch" data-lightbox-cartel="${c.id}" style="background-image:url('${c.imagen}'); background-size:cover; background-position:center; cursor:zoom-in;"></div>`
    : `<div class="gallery-swatch" style="background:linear-gradient(135deg, ${color}33, ${color}0d); color:${color}; border-bottom-color:${color}33;">${esc(c.nombre)}</div>`;
  return `
    <div class="gallery-card">
      ${swatch}
      <div class="gallery-card-body">
        <h4>${esc(c.nombre)}</h4>
        <p>${esc(c.descripcion||'')}</p>
        <span class="pill ${av.disponible?'pill-green':'pill-warn'}">${availLabel}</span>
        <button class="btn btn-primary btn-block" data-reservar="${c.id}">Reservar</button>
      </div>
    </div>
  `;
}

function catalogShareText(clienteNombre){
  const disponibles = arr('carteles').filter(c => c.estado === 'disponible');
  const porTema = {};
  disponibles.forEach(c => { (porTema[c.tematica||'Otro'] = porTema[c.tematica||'Otro']||[]).push(c); });
  let txt = `¡Hola${clienteNombre?' '+clienteNombre:''}! 👋 Te paso el catálogo de Puelo Neón 💚\n\n`;
  Object.keys(porTema).forEach(tema => {
    txt += `*${tema}*\n`;
    porTema[tema].forEach(c => { txt += `• ${c.nombre}\n`; });
    txt += `\n`;
  });
  txt += `También tenemos alquiler mensual y suscripciones con cambio de cartel cada 10 o 15 días.\n\nRespondé este mensaje contándome qué cartel o qué plan te interesa y coordinamos la entrega. ✨`;
  return txt;
}

/* ---- Reserva (cliente) ---- */
function openReservarModal(cartelId){
  const cartel = getDoc('carteles', cartelId);
  if (!cartel) return;
  const cfg = getConfig();
  const av = cartelAvailability(cartelId);
  let tipo = 'dia';

  openModal(`
    ${modalHead('Reservar: ' + cartel.nombre)}
    <p style="margin:-6px 0 14px; font-size:12.5px; color:var(--ink-dim);">${av.disponible ? 'Este cartel está disponible hoy.' : (av.dias==null ? 'Consultanos la disponibilidad exacta.' : `Disponible en ${av.dias} día${av.dias===1?'':'s'}${av.fecha? ' (desde el '+fmtDate(av.fecha)+')':''}.`)}</p>
    <div class="field"><label>Tipo de alquiler</label>
      <div class="field-chips" id="r-tipo-chips">${PLAN_TIPOS.map(p=>`<button type="button" class="field-chip ${p.id==='dia'?'sel':''}" data-tipo="${p.id}">${p.label}</button>`).join('')}</div>
    </div>
    <div id="r-extra"></div>
    <div class="field"><label>Tu nombre</label><input type="text" id="r-nombre" placeholder="Nombre y apellido"></div>
    <div class="field"><label>Dirección de entrega</label><input type="text" id="r-direccion" placeholder="Dirección"></div>
    <div class="card" style="margin:6px 0 14px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:12.5px; color:var(--ink-dim); font-weight:700;">Total estimado</span>
      <span id="r-total" style="font-family:var(--font-display); font-size:20px; color:var(--green);">—</span>
    </div>
    <div class="err-msg" id="r-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-wa" id="r-send">${ICON.wa}Enviar por WhatsApp</button>
    </div>
  `);

  function currentSelection(){
    if (tipo === 'dia'){
      const diasInput = document.getElementById('r-dias');
      const dias = Math.max(1, Number(diasInput ? diasInput.value : 1) || 1);
      return { total: dias * (cfg.precioDia||0), label: `Alquiler por día (${dias} día${dias===1?'':'s'})` };
    }
    if (tipo === 'mensual_fijo'){
      return { total: cfg.precioMensualFijo||0, label: 'Alquiler mensual fijo' };
    }
    if (tipo === 'membresia'){
      const mesesBtn = document.querySelector('#r-meses-chips .field-chip.sel');
      const freqBtn = document.querySelector('#r-freq-chips .field-chip.sel');
      const meses = mesesBtn ? Number(mesesBtn.getAttribute('data-meses')) : 3;
      const freq = freqBtn ? Number(freqBtn.getAttribute('data-freq')) : 15;
      return { total: meses * (cfg.precioMembresiaMes||0), label: `Membresía ${meses} ${meses===1?'mes':'meses'} (cambio cada ${freq} días)` };
    }
    return { total: cfg.especialPrecio||0, label: cfg.especialNombre || 'Alquiler especial' };
  }

  function recalc(){
    const sel = currentSelection();
    document.getElementById('r-total').textContent = sel.total ? fmtMoney(sel.total) : 'A confirmar';
  }

  function renderExtra(){
    const box = document.getElementById('r-extra');
    if (tipo === 'dia'){
      box.innerHTML = `<div class="field"><label>Cantidad de días</label><input type="number" min="1" step="1" id="r-dias" value="1"></div>`;
      document.getElementById('r-dias').oninput = recalc;
    } else if (tipo === 'membresia'){
      box.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Duración</label><div class="field-chips" id="r-meses-chips">${PLAN_MESES.map(m=>`<button type="button" class="field-chip ${m===3?'sel':''}" data-meses="${m}">${m} ${m===1?'mes':'meses'}</button>`).join('')}</div></div>
          <div class="field"><label>Cambio cada</label><div class="field-chips" id="r-freq-chips">${FREQS.map(f=>`<button type="button" class="field-chip ${f===15?'sel':''}" data-freq="${f}">${f} días</button>`).join('')}</div></div>
        </div>`;
      document.querySelectorAll('#r-meses-chips .field-chip').forEach(b=> b.onclick=()=>{ document.querySelectorAll('#r-meses-chips .field-chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); recalc(); });

function openModal(html, opts){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="backdrop"><div class="modal ${opts&&opts.wide?'wide':''}">${html}</div></div>`;
  document.getElementById('backdrop').onclick = (e) => { if (e.target.id === 'backdrop') closeModal(); };
  document.querySelectorAll('.modal-close').forEach(b => b.onclick = closeModal);
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function clienteOptions(selId){
  return arr('clientes').sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${esc(c.nombre)}</option>`).join('');
}
function cartelOptions(selId, onlyDisponibles){
  let list = arr('carteles');
  if (onlyDisponibles) list = list.filter(c => c.estado==='disponible' || c.id===selId);
  return list.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${esc(c.nombre)} ${c.estado==='alquilado'&&c.id!==selId?'(alquilado)':''}</option>`).join('');
}

function openAlquilerForm(id){
  const a = id ? getDoc('alquileres', id) : null;
  if (arr('clientes').length === 0 || arr('carteles').length === 0){
    openModal(`${modalHead('Nuevo alquiler')}<div class="empty"><b>Faltan datos</b>Necesitás al menos un cliente y un cartel cargados para crear un alquiler.</div>
      <div class="modal-actions"><button class="btn btn-primary modal-close" style="flex:1;">Entendido</button></div>`);
    return;
  }
  openModal(`
    ${modalHead(a ? 'Editar alquiler' : 'Nuevo alquiler')}
    <div class="field"><label>Cliente</label><select id="f-cliente">${clienteOptions(a?a.clienteId:null)}</select></div>
    <div class="field"><label>Cartel</label><select id="f-cartel">${cartelOptions(a?a.cartelId:null, true)}</select></div>
    <div class="field-row">
      <div class="field"><label>Fecha de entrega</label><input type="date" id="f-entrega" value="${a?a.fechaEntrega:todayStr()}"></div>
      <div class="field"><label>Fecha de retiro</label><input type="date" id="f-retiro" value="${a?a.fechaRetiro:addDays(todayStr(),7)}"></div>
    </div>
    <div class="field"><label>Monto acordado</label><input type="number" id="f-monto" min="0" step="500" value="${a&&a.monto?a.monto:''}" placeholder="$"></div>
    <div class="field"><label>Detalles</label><textarea id="f-detalles" placeholder="Dirección de entrega, horario, condiciones…">${esc(a?a.detalles:'')}</textarea></div>
    <div class="err-msg" id="f-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-primary" id="f-save">Guardar</button>
    </div>
  `);
  document.getElementById('f-save').onclick = async () => {
    const clienteId = document.getElementById('f-cliente').value;
    const cartelId = document.getElementById('f-cartel').value;
    const entrega = document.getElementById('f-entrega').value;
    const retiro = document.getElementById('f-retiro').value;
    if (!clienteId || !cartelId || !entrega || !retiro){ document.getElementById('f-err').textContent = 'Completá cliente, cartel y fechas.'; return; }
    if (retiro < entrega){ document.getElementById('f-err').textContent = 'La fecha de retiro debe ser posterior a la de entrega.'; return; }
    const cliente = getDoc('clientes', clienteId);
    const cartel = getDoc('carteles', cartelId);

      cartelId, cartelNombre: cartel.nombre,

    await writeDoc('alquileres', theId, data);
    if (!a) await patchDoc('carteles', cartelId, { estado: 'alquilado' });
    closeModal(); render();
    showToast(a ? 'Alquiler actualizado' : 'Alquiler registrado');
  };
}

async function finishRental(id){
  const a = getDoc('alquileres', id);

  await patchDoc('alquileres', id, { estado: 'finalizado' });
  await patchDoc('carteles', a.cartelId, { estado: 'disponible' });
  render();
  showToast('Marcado como retirado');
}

      fechaInicio: inicio, fechaFin,
      cartelActualId: cartelId, cartelActualNombre: cartel.nombre,
      proximoCambio: s ? s.proximoCambio : addDays(inicio, frecuenciaDias),
      historial: s ? s.historial : [{ fecha: inicio, cartelNombre: cartel.nombre }],
      estado: s ? s.estado : 'activa',
    };
    const theId = id || uid();
    await writeDoc('suscripciones', theId, data);
    if (!s) await patchDoc('carteles', cartelId, { estado: 'alquilado' });
    closeModal(); render();
    showToast(s ? 'Suscripción actualizada' : 'Suscripción creada');
  };
}

function openSubCambiar(id){
  const s = getDoc('suscripciones', id);
  if (!s) return;
  openModal(`
    ${modalHead('Cambiar vidriera')}
    <p style="margin:0 0 14px; color:var(--ink-dim); font-size:13px;">Suscripción de <b style="color:var(--ink);">${esc(s.clienteNombre)}</b>. Cartel actual: <b style="color:var(--ink);">${esc(s.cartelActualNombre||'—')}</b>.</p>
    <div class="field"><label>Nuevo cartel</label><select id="f-cartel">${cartelOptions(null, true)}</select></div>
    <div class="field"><label>Fecha del cambio</label><input type="date" id="f-fecha" value="${todayStr()}"></div>
    <div class="err-msg" id="f-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-primary" id="f-save">Registrar cambio</button>
    </div>
  `);
  document.getElementById('f-save').onclick = async () => {
    const cartelId = document.getElementById('f-cartel').value;
    const fecha = document.getElementById('f-fecha').value;
    if (!cartelId || !fecha){ document.getElementById('f-err').textContent = 'Elegí el nuevo cartel y la fecha.'; return; }
    const nuevoCartel = getDoc('carteles', cartelId);
    const cartelAnteriorId = s.cartelActualId;
    let proximo = addDays(fecha, s.frecuenciaDias);
    if (proximo > s.fechaFin) proximo = s.fechaFin;
    const historial = (s.historial||[]).concat([{ fecha, cartelNombre: nuevoCartel.nombre }]);
    await patchDoc('suscripciones', id, { cartelActualId: cartelId, cartelActualNombre: nuevoCartel.nombre, proximoCambio: proximo, historial });
    await patchDoc('carteles', cartelId, { estado: 'alquilado' });
    if (cartelAnteriorId && cartelAnteriorId !== cartelId) await patchDoc('carteles', cartelAnteriorId, { estado: 'disponible' });
    closeModal(); render();
    showToast('Cambio de vidriera registrado');
  };
}

function openSubDetalle(id){
  const s = getDoc('suscripciones', id);
  if (!s) return;
  const hist = (s.historial||[]).slice().reverse();
  openModal(`
    ${modalHead('Historial de suscripción')}
    <p style="margin:0 0 4px; font-size:13.5px; color:var(--ink);"><b>${esc(s.clienteNombre)}</b> · plan de ${s.planMeses} ${s.planMeses===1?'mes':'meses'}</p>
    <p style="margin:0 0 16px; font-size:12.5px; color:var(--ink-dim);">${fmtDate(s.fechaInicio)} — ${fmtDate(s.fechaFin)} · ${fmtMoney(s.montoTotal)} · cambia cada ${s.frecuenciaDias} días</p>
    <div class="list">${hist.length ? hist.map(h=>`
      <div class="reminder sev-ok"><div class="dotstat"></div><div class="body"><div class="ttl">${esc(h.cartelNombre)}</div><div class="sub">Colocado el ${fmtDate(h.fecha)}</div></div></div>
    `).join('') : '<div class="empty">Sin cambios registrados todavía.</div>'}</div>
    <div class="modal-actions"><button class="btn btn-primary modal-close" style="flex:1;">Cerrar</button></div>
  `);
}

async function finishSub(id){
  const s = getDoc('suscripciones', id);
  if (!s) return;
  await patchDoc('suscripciones', id, { estado: 'finalizada' });
  if (s.cartelActualId) await patchDoc('carteles', s.cartelActualId, { estado: 'disponible' });
  render();
  showToast('Suscripción finalizada');
}

/* ============================== DELETE CONFIRM ============================== */
const DELETE_LABEL = { clientes: 'cliente', carteles: 'cartel', alquileres: 'alquiler', suscripciones: 'suscripción' };
function confirmDelete(col, id){
  openModal(`
    ${modalHead('¿Eliminar ' + DELETE_LABEL[col] + '?')}
    <p style="margin:0 0 6px; color:var(--ink-dim); font-size:13.5px;">Esta acción no se puede deshacer.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-danger" id="f-confirm-del">${ICON.trash}Eliminar</button>
    </div>
  `);
  document.getElementById('f-confirm-del').onclick = async () => {
    await deleteDoc(col, id);
    closeModal(); render();
    showToast('Eliminado');
  };
}

/* ============================== EVENT DELEGATION ============================== */
document.addEventListener('click', (e) => {
  const openBtn = e.target.closest('[data-open]');
  if (openBtn){
    const kind = openBtn.getAttribute('data-open');
    const id = openBtn.getAttribute('data-id') || null;
    if (kind === 'cliente-nuevo') openClienteForm(null);
    else if (kind === 'cliente-editar') openClienteForm(id);
    else if (kind === 'cartel-nuevo') openCartelForm(null);
    else if (kind === 'cartel-editar') openCartelForm(id);
    else if (kind === 'alquiler-nuevo') openAlquilerForm(null);
    else if (kind === 'alquiler-editar') openAlquilerForm(id);
    else if (kind === 'sub-nuevo') openSubForm(null);
    else if (kind === 'sub-editar') openSubForm(id);
    else if (kind === 'sub-cambiar') openSubCambiar(id);
    else if (kind === 'sub-detalle') openSubDetalle(id);
    else if (kind === 'precios-editar') openPreciosForm();
    else if (kind === 'temas-gestionar') openTemasManage();
    else if (kind === 'estilo-editar') openEstiloEditar(id);
    return;
  }

  const personalizadoBtn = e.target.closest('[data-open-personalizado]');
  if (personalizadoBtn){ openPersonalizadoModal(); return; }

  const waPersonalizado = e.target.closest('[data-wa-personalizado]');
  if (waPersonalizado){
    const p = getDoc('personalizados', waPersonalizado.getAttribute('data-wa-personalizado'));
    if (p) window.open(waLink(p.telefono, `¡Hola ${p.nombre}! Te escribo por tu pedido de cartel personalizado en Puelo Neón.`), '_blank', 'noopener');
    return;
  }

  const togglePersonalizado = e.target.closest('[data-toggle-personalizado]');
  if (togglePersonalizado){
    const id2 = togglePersonalizado.getAttribute('data-toggle-personalizado');
    const p = getDoc('personalizados', id2);
    if (p) patchDoc('personalizados', id2, { estado: p.estado === 'atendido' ? 'pendiente' : 'atendido' }).then(render);
    return;
  }

  const gateBtn = e.target.closest('[data-gate]');
  if (gateBtn){
    const which = gateBtn.getAttribute('data-gate');
    if (which === 'cliente') setScreen('client');
    else if (which === 'admin'){
      let already = false;
      try { already = localStorage.getItem('pueloneon_admin_auth') === 'ok'; } catch(e){}
      if (already) setScreen('admin'); else openAdminPasswordModal();
    } else if (which === 'salir') setScreen('gate');
    return;
  }

  const logoutBtn = e.target.closest('[data-logout]');
  if (logoutBtn){
    try { localStorage.removeItem('pueloneon_admin_auth'); } catch(e){}
    setScreen('gate');
    return;
  }

  const reservarBtn = e.target.closest('[data-reservar]');
  if (reservarBtn){ openReservarModal(reservarBtn.getAttribute('data-reservar')); return; }

  const lightboxBtn = e.target.closest('[data-lightbox-cartel]');
  if (lightboxBtn){
    const cc = getDoc('carteles', lightboxBtn.getAttribute('data-lightbox-cartel'));
    if (cc && cc.imagen) openLightbox(cc.imagen);
    return;
  }

  const delBtn = e.target.closest('[data-del]');
  if (delBtn){ confirmDelete(delBtn.getAttribute('data-del'), delBtn.getAttribute('data-id')); return; }

  const finRental = e.target.closest('[data-finish-rental]');
  if (finRental){ finishRental(finRental.getAttribute('data-finish-rental')); return; }

  const finSub = e.target.closest('[data-finish-sub]');
  if (finSub){ finishSub(finSub.getAttribute('data-finish-sub')); return; }

  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn){ catFilter = filterBtn.getAttribute('data-filter'); render(); return; }

  const shareCat = e.target.closest('[data-share-catalog]');
  if (shareCat){ window.open(waLink('', catalogShareText('')), '_blank', 'noopener'); return; }

  const waClient = e.target.closest('[data-wa-catalog]');
  if (waClient){
    const c = getDoc('clientes', waClient.getAttribute('data-wa-catalog'));
    if (c) window.open(waLink(c.telefono, catalogShareText(c.nombre)), '_blank', 'noopener');
    return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'searchInput'){
    search = e.target.value;
    const active = document.activeElement === e.target;
    render();
    if (active){ const el = document.getElementById('searchInput'); if (el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }
  }
});

/* ============================== INIT ============================== */
renderGateScreen();
initData();
})();
</script>
</body>
</html>
