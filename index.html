function openReservarModal(cartelId){
  const cartel = getDoc('carteles', cartelId);
  if (!cartel) return;
  const cfg = getConfig();
  const av = cartelAvailability(cartelId);
  const accionLabel = av.disponible ? 'Alquilar' : 'Reservar';
  let tipo = 'dia';

  openModal(`
    ${modalHead(accionLabel + ': ' + cartel.nombre)}
    <p style="margin:-6px 0 14px; font-size:12.5px; color:var(--ink-dim);">${av.disponible ? 'Este cartel está disponible hoy.' : (av.dias==null ? 'Consultanos la disponibilidad exacta.' : `Disponible en ${av.dias} día${av.dias===1?'':'s'}${av.fecha? ' (desde el '+fmtDate(av.fecha)+')':''}.`)}</p>
    <div class="field"><label>Tipo de alquiler</label>
      <div class="field-chips" id="r-tipo-chips">${PLAN_TIPOS.map(p=>`<button type="button" class="field-chip ${p.id==='dia'?'sel':''}" data-tipo="${p.id}">${p.label}</button>`).join('')}</div>
    </div>
    <div id="r-extra"></div>
    <div class="field"><label>Tu nombre</label><input type="text" id="r-nombre" placeholder="Nombre y apellido"></div>
    <div class="field"><label>Dirección de entrega</label><input type="text" id="r-direccion" placeholder="Dirección"></div>
    <div class="card" style="margin:6px 0 14px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:12.5px; color:var(--ink-dim); font-weight:700;">Total estimado</span>
      <span id="r-total" style="font-family:var(--font-display); font-size:20px; color:var(--green);">—</span>
    </div>
    <div class="err-msg" id="r-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-wa" id="r-send">${ICON.wa}Enviar por WhatsApp</button>
    </div>
  `);

  function currentSelection(){
    if (tipo === 'dia'){
      const diasInput = document.getElementById('r-dias');
      const dias = Math.max(1, Number(diasInput ? diasInput.value : 1) || 1);
      return { total: dias * (cfg.precioDia||0), label: `Alquiler por día (${dias} día${dias===1?'':'s'})` };
    }
    if (tipo === 'mensual_fijo'){
      return { total: cfg.precioMensualFijo||0, label: 'Alquiler mensual fijo' };
    }
    if (tipo === 'membresia'){
      const mesesBtn = document.querySelector('#r-meses-chips .field-chip.sel');
      const freqBtn = document.querySelector('#r-freq-chips .field-chip.sel');
      const meses = mesesBtn ? Number(mesesBtn.getAttribute('data-meses')) : 3;
      const freq = freqBtn ? Number(freqBtn.getAttribute('data-freq')) : 15;
      return { total: meses * (cfg.precioMembresiaMes||0), label: `Plan Vidriera Dinámica · ${meses} ${meses===1?'mes':'meses'} (cambio cada ${freq} días)` };
    }
    return { total: cfg.especialPrecio||0, label: cfg.especialNombre || 'Alquiler especial' };
  }

  function recalc(){
    const sel = currentSelection();
    document.getElementById('r-total').textContent = sel.total ? fmtMoney(sel.total) : 'A confirmar';
  }

  function renderExtra(){
    const box = document.getElementById('r-extra');
    if (tipo === 'dia'){
      box.innerHTML = `<div class="field"><label>Cantidad de días</label><input type="number" min="1" step="1" id="r-dias" value="1"></div>`;
      document.getElementById('r-dias').oninput = recalc;
    } else if (tipo === 'membresia'){
      box.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Duración</label><div class="field-chips" id="r-meses-chips">${PLAN_MESES.map(m=>`<button type="button" class="field-chip ${m===3?'sel':''}" data-meses="${m}">${m} ${m===1?'mes':'meses'}</button>`).join('')}</div></div>
          <div class="field"><label>Cambio cada</label><div class="field-chips" id="r-freq-chips">${FREQS.map(f=>`<button type="button" class="field-chip ${f===15?'sel':''}" data-freq="${f}">${f} días</button>`).join('')}</div></div>
        </div>`;
      document.querySelectorAll('#r-meses-chips .field-chip').forEach(b=> b.onclick=()=>{ document.querySelectorAll('#r-meses-chips .field-chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); recalc(); });
      document.querySelectorAll('#r-freq-chips .field-chip').forEach(b=> b.onclick=()=>{ document.querySelectorAll('#r-freq-chips .field-chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); recalc(); });
    } else {
      box.innerHTML = '';
    }
    recalc();
  }

  document.querySelectorAll('#r-tipo-chips .field-chip').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#r-tipo-chips .field-chip').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      tipo = b.getAttribute('data-tipo');
      renderExtra();
    };
  });
  renderExtra();

  document.getElementById('r-send').onclick = () => {
    const nombre = document.getElementById('r-nombre').value.trim();
    const direccion = document.getElementById('r-direccion').value.trim();
    if (!nombre || !direccion){ document.getElementById('r-err').textContent = 'Completá tu nombre y dirección.'; return; }
    const sel = currentSelection();
    const msg = `¡Hola! Quiero ${accionLabel.toLowerCase()} un cartel de Puelo Neón 💚\n\n`+

function openModal(html, opts){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="backdrop"><div class="modal ${opts&&opts.wide?'wide':''}">${html}</div></div>`;
  document.getElementById('backdrop').onclick = (e) => { if (e.target.id === 'backdrop') closeModal(); };
  document.querySelectorAll('.modal-close').forEach(b => b.onclick = closeModal);
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function openLightbox(url){
  if (!url) return;

  root.innerHTML = `

      <div style="position:relative; max-width:100%; max-height:100%;">

        <button class="iconbtn" id="lightbox-close" style="position:absolute; top:-14px; right:-14px; background:#0f1c16;">${ICON.close}</button>

}

function clienteOptions(selId){
  return arr('clientes').sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${esc(c.nombre)}</option>`).join('');
}
function cartelOptions(selId, onlyDisponibles){
  let list = arr('carteles');
  if (onlyDisponibles) list = list.filter(c => c.estado==='disponible' || c.id===selId);
  return list.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${esc(c.nombre)} ${c.estado==='alquilado'&&c.id!==selId?'(alquilado)':''}</option>`).join('');
}

function openAlquilerForm(id){
  const a = id ? getDoc('alquileres', id) : null;
  if (arr('clientes').length === 0 || arr('carteles').length === 0){
    openModal(`${modalHead('Nuevo alquiler')}<div class="empty"><b>Faltan datos</b>Necesitás al menos un cliente y un cartel cargados para crear un alquiler.</div>
      <div class="modal-actions"><button class="btn btn-primary modal-close" style="flex:1;">Entendido</button></div>`);
    return;
  }
  openModal(`
    ${modalHead(a ? 'Editar alquiler' : 'Nuevo alquiler')}
    <div class="field"><label>Cliente</label><select id="f-cliente">${clienteOptions(a?a.clienteId:null)}</select></div>
    <div class="field"><label>Cartel</label><select id="f-cartel">${cartelOptions(a?a.cartelId:null, true)}</select></div>
    <div class="field-row">
      <div class="field"><label>Fecha de entrega</label><input type="date" id="f-entrega" value="${a?a.fechaEntrega:todayStr()}"></div>
      <div class="field"><label>Fecha de retiro</label><input type="date" id="f-retiro" value="${a?a.fechaRetiro:addDays(todayStr(),7)}"></div>
    </div>
    <div class="field"><label>Monto acordado</label><input type="number" id="f-monto" min="0" step="500" value="${a&&a.monto?a.monto:''}" placeholder="$"></div>
    <div class="field"><label>Detalles</label><textarea id="f-detalles" placeholder="Dirección de entrega, horario, condiciones…">${esc(a?a.detalles:'')}</textarea></div>
    <div class="err-msg" id="f-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-primary" id="f-save">Guardar</button>
    </div>
  `);
  document.getElementById('f-save').onclick = async () => {
    const clienteId = document.getElementById('f-cliente').value;
    const cartelId = document.getElementById('f-cartel').value;
    const entrega = document.getElementById('f-entrega').value;
    const retiro = document.getElementById('f-retiro').value;
    if (!clienteId || !cartelId || !entrega || !retiro){ document.getElementById('f-err').textContent = 'Completá cliente, cartel y fechas.'; return; }
    if (retiro < entrega){ document.getElementById('f-err').textContent = 'La fecha de retiro debe ser posterior a la de entrega.'; return; }
    const cliente = getDoc('clientes', clienteId);
    const cartel = getDoc('carteles', cartelId);
    const data = {
      clienteId, clienteNombre: cliente.nombre,
      cartelId, cartelNombre: cartel.nombre,

      estado: a ? a.estado : 'activo',
    };
    const theId = id || uid();
    await writeDoc('alquileres', theId, data);
    if (!a) await patchDoc('carteles', cartelId, { estado: 'alquilado' });
    closeModal(); render();
    showToast(a ? 'Alquiler actualizado' : 'Alquiler registrado');
  };
}

async function finishRental(id){
  const a = getDoc('alquileres', id);
  if (!a) return;
  await patchDoc('alquileres', id, { estado: 'finalizado' });
  await patchDoc('carteles', a.cartelId, { estado: 'disponible' });
  render();
  showToast('Marcado como retirado');
}

  });

    <p style="margin:0 0 14px; color:var(--ink-dim); font-size:13px;">Suscripción de <b style="color:var(--ink);">${esc(s.clienteNombre)}</b>. Cartel actual: <b style="color:var(--ink);">${esc(s.cartelActualNombre||'—')}</b>.</p>
    <div class="field"><label>Nuevo cartel</label><select id="f-cartel">${cartelOptions(null, true)}</select></div>
    <div class="field"><label>Fecha del cambio</label><input type="date" id="f-fecha" value="${todayStr()}"></div>
    <div class="err-msg" id="f-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancelar</button>
      <button class="btn btn-primary" id="f-save">Registrar cambio</button>
    </div>
  `);
  document.getElementById('f-save').onclick = async () => {
    const cartelId = document.getElementById('f-cartel').value;
    const fecha = document.getElementById('f-fecha').value;
    if (!cartelId || !fecha){ document.getElementById('f-err').textContent = 'Elegí el nuevo cartel y la fecha.'; return; }
    const nuevoCartel = getDoc('carteles', cartelId);
    const cartelAnteriorId = s.cartelActualId;
    let proximo = addDays(fecha, s.frecuenciaDias);
    if (proximo > s.fechaFin) proximo = s.fechaFin;
    const historial = (s.historial||[]).concat([{ fecha, cartelNombre: nuevoCartel.nombre }]);
    await patchDoc('suscripciones', id, { cartelActualId: cartelId, cartelActualNombre: nuevoCartel.nombre, proximoCambio: proximo, historial });
    await patchDoc('carteles', cartelId, { estado: 'alquilado' });
    if (cartelAnteriorId && cartelAnteriorId !== cartelId) await patchDoc('carteles', cartelAnteriorId, { estado: 'disponible' });
    closeModal(); render();
    showToast('Cambio de vidriera registrado');
  };

/* ============================== TIENDA ============================== */
/* ---- Utilidades ---- */
function getTienda(){
  const t = getDoc('config','tienda') || {};
  return Object.assign({}, DEFAULT_TIENDA, t);
}
const ACRONIMOS = ['LED','RGB','RGBW','DC','AC','USB','PP','CM','UV','IP','PVC','SMD'];
const ACENTOS = { neon: 'neón', plastico: 'plástico', tactil: 'táctil', calido: 'cálido', frio: 'frío', corporea: 'corpórea', acrilico: 'acrílico' };
function limpiarNombre(raw){
  let n = String(raw || '').trim();
  const sinCodigo = n.replace(/^\([^)]*\)\s*/, '').trim();
  if (sinCodigo) n = sinCodigo;
  const letras = n.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g, '');
  const mayus = letras.replace(/[^A-ZÁÉÍÓÚÜÑ]/g, '').length;
  if (letras.length && mayus / letras.length > 0.6){
    n = n.split(/(\s+)/).map(tok => {
      if (!tok.trim()) return tok;
      if (/\d/.test(tok)) return tok;
      const core = tok.replace(/[^A-Za-zÁÉÍÓÚÜÑ]/g, '').toUpperCase();
      if (ACRONIMOS.indexOf(core) !== -1) return tok.toUpperCase();
      return tok.toLowerCase();
    }).join('');
  }
  n = n.replace(/\b(neon|plastico|tactil|calido|frio|corporea|acrilico)\b/gi, m => {
    const r = ACENTOS[m.toLowerCase()];
    return (m[0] !== m[0].toLowerCase()) ? r.charAt(0).toUpperCase() + r.slice(1) : r;
  });
  return n.charAt(0).toUpperCase() + n.slice(1);
}
function guessCategoria(nombre){
  const n = String(nombre || '').toLowerCase();
  if (/fuente/.test(n)) return 'Fuentes de alimentación';
  if (/ne[oó]n/.test(n)) return 'Neón LED';
  if (/tira|zig ?zag|rollo/.test(n)) return 'Tiras LED';
  if (/controlador|dimmer/.test(n)) return 'Controladoras y dimmers';
  if (/sensor/.test(n)) return 'Sensores';
  if (/cable|ficha|plug|conector|empalme/.test(n)) return 'Cables y conectores';
  if (/perfil|soporte|separador|acr[ií]lico/.test(n)) return 'Perfiles y soportes';
  if (/activador|ciano|pegamento|adhesivo/.test(n)) return 'Adhesivos';
  return 'Otros';
}
function precioSugerido(costo, margen){
  const c = Number(costo) || 0;
  if (c <= 0) return 0;
  return Math.ceil(c * (1 + (Number(margen) || 0) / 100) / 10) * 10;
}
function productoDesdeMaterial(m, margen){
  const nombre = limpiarNombre(m.nombre);
  return {
    nombre, descripcion: '', categoria: guessCategoria(nombre), precio: precioSugerido(m.costo, margen),
    imagen: null, materialId: m.id, stock: null, visible: false, unidad: m.unidad || 'unidad',
  };
}
function productoStock(p){
  if (p.materialId){
    const m = getDoc('materiales', p.materialId);
    if (m) return Number(m.cantidad) || 0;
  }
  if (p.stock != null && p.stock !== '') return Number(p.stock) || 0;
  return null;
}
function productosPublicos(){
  return arr('productos').filter(p => p.visible && Number(p.precio) > 0);
}
async function importTiendaInicial(){
  if (getDoc('config', 'importado_tienda_v1')) return;
  const iluMats = arr('materiales').filter(m => /^\s*\(/.test(m.nombre || ''));
  if (!iluMats.length) return;
  const margen = getTienda().margen;
  for (const m of iluMats){
    const pid = 'mat-' + m.id;
    if (getDoc('productos', pid)) continue;
    await writeDoc('productos', pid, productoDesdeMaterial(m, margen));
  }
  await writeDoc('config', 'importado_tienda_v1', { hecho: true, fecha: todayStr() });
}

  }

    <div class="page-head">

    </div>

      <div>
        <b>${t.abierta ? '🟢 Tienda abierta' : '🟠 Tienda en mantenimiento'}</b>
        <span class="d">${t.abierta ? 'Tus clientes ya ven los productos publicados y pueden armar su carrito.' : 'Los clientes ven el cartel "En mantenimiento". Cuando tengas todo listo, abrila.'}</span>
      </div>
      <button class="btn ${t.abierta ? 'btn-ghost' : 'btn-primary'}" data-tienda-toggle="1">${t.abierta ? 'Pasar a mantenimiento' : 'Abrir tienda'}</button>
    </div>

    <div class="grid-stats">
      <div class="card stat"><div class="n">${todos.length}</div><div class="l">Productos</div></div>
      <div class="card stat glow"><div class="n">${listos}</div><div class="l">Publicados</div></div>
      <div class="card stat"><div class="n">${borradores}</div><div class="l">Borradores</div></div>

    </div>

      <button class="btn btn-ghost btn-sm" data-open="tienda-publicar">Publicar todos los listos</button>
    </div>

      ${cats.map(c => `<button class="chip ${tiendaFilter===c?'active':''}" data-tfilter="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    ${todos.length === 0 ? `<div class="empty"><b>Todavía no hay productos</b>Sumalos desde tu stock con "Agregar del stock" o creá uno nuevo.</div>` :
      list.length === 0 ? `<div class="empty"><b>No hay productos para mostrar</b>Probá con otra búsqueda o categoría.</div>` :
      `<div class="list">${list.map(productoRow).join('')}</div>`}

function productoRow(p){
  const st = productoStock(p);
  const tienePrecio = Number(p.precio) > 0;
  const thumb = p.imagen ? `<img src="${p.imagen}" alt="" style="width:100%;height:100%;object-fit:cover;">` : ICON.box;
  return `<div class="row-card">
    <div class="row-avatar" style="width:48px;height:48px;overflow:hidden;padding:0;">${thumb}</div>

      <div class="t1">${esc(p.nombre)}</div>
      <div class="t2">${esc(p.categoria || 'Otros')} · ${tienePrecio ? fmtMoney(p.precio) : '<span style="color:var(--warn);">Sin precio</span>'}${st != null ? ' · Stock ' + st : ''}${p.materialId ? ' <span title="Vinculado al stock">🔗</span>' : ''}</div>
      <div style="margin-top:6px;"><button type="button" class="pill ${p.visible ? 'pill-green' : 'pill-mute'}" data-tprod-toggle="${p.id}" style="cursor:pointer; font-family:inherit;" title="Tocá para ${p.visible ? 'pasar a borrador' : 'publicar'}">${p.visible ? 'Publicado' : 'Borrador'}</button></div>
    </div>

      <button class="iconbtn" data-open="producto-editar" data-id="${p.id}" title="Editar">${ICON.edit}</button>
      <button class="iconbtn" data-del="productos" data-id="${p.id}" title="Eliminar">${ICON.trash}</button>
    </div>
  </div>`;
}

async function toggleTienda(){
  const t = getTienda();
  const nueva = !t.abierta;
  if (nueva && productosPublicos().length === 0){
    showToast('Publicá al menos un producto con precio antes de abrir la tienda.');
    return;
  }

/* ---- Cliente: tienda y carrito ---- */
function getCart(){
  try { return JSON.parse(localStorage.getItem('pueloneon_cart') || '{}') || {}; } catch(e){ return {}; }
}
function saveCart(c){
  try { localStorage.setItem('pueloneon_cart', JSON.stringify(c)); } catch(e){}
}
function cartItems(cart){
  cart = cart || getCart();
  const items = [];
  Object.keys(cart).forEach(pid => {
    const p = getDoc('productos', pid);
    if (!p || !p.visible || !(Number(p.precio) > 0)) return;
    const q = Number(cart[pid]) || 0;
    if (q > 0) items.push({ p, q, subtotal: q * Number(p.precio) });
  });
  return items;
}
function cartChange(pid, delta){
  const p = getDoc('productos', pid);
  if (!p) return;
  const cart = getCart();
  let q = (Number(cart[pid]) || 0) + delta;
  const st = productoStock(p);
  if (st != null && q > st){ q = st; showToast('No hay más stock de este producto.'); }
  if (q <= 0) delete cart[pid]; else cart[pid] = q;
  saveCart(cart);
  updateShopUI();
}
function cartRemove(pid){
  const cart = getCart();
  delete cart[pid];
  saveCart(cart);
  updateShopUI();
}
function cartClear(){ saveCart({}); updateShopUI(); }
function updateShopUI(){
  if (screen === 'shop') renderShopScreen();
  if (document.getElementById('cart-modal-marker')){
    if (cartItems().length) openCartModal(); else closeModal();
  }
}

function shopGridHtml(){
  let list = productosPublicos();
  if (shopFilter !== 'Todas') list = list.filter(p => (p.categoria || 'Otros') === shopFilter);
  if (shopSearch.trim()){
    const q = shopSearch.trim().toLowerCase();
    list = list.filter(p => (p.nombre||'').toLowerCase().includes(q) || (p.descripcion||'').toLowerCase().includes(q) || (p.categoria||'').toLowerCase().includes(q));
  }
  list.sort((a,b) => (a.categoria||'').localeCompare(b.categoria||'') || (a.nombre||'').localeCompare(b.nombre||''));
  if (!list.length){
    return `<div class="empty"><b>No encontramos productos</b>${productosPublicos().length ? 'Probá con otra búsqueda o categoría.' : 'Todavía no hay productos publicados.'}</div>`;
  }
  const cart = getCart();
  return `<div class="shop-grid">${list.map(p => shopCardHtml(p, cart)).join('')}</div>`;
}
function shopCardHtml(p, cart){
  const st = productoStock(p);
  const q = Number(cart[p.id]) || 0;
  const agotado = st != null && st <= 0;
  const img = p.imagen
    ? `<div class="shop-img" data-lightbox-photo="productos|${p.id}" style="background-image:url('${p.imagen}');"></div>`
    : `<div class="shop-img placeholder">${ICON.box}</div>`;
  const control = agotado
    ? `<button class="btn btn-ghost btn-block" disabled>Agotado</button>`
    : (q > 0
      ? `<div class="stepper"><button data-cart-dec="${p.id}">−</button><span>${q}</span><button data-cart-inc="${p.id}">+</button></div>`
      : `<button class="btn btn-primary btn-block" data-cart-add="${p.id}">Agregar</button>`);
  return `
    <div class="shop-card">
      ${img}
      <div class="shop-card-body">
        <h4>${esc(p.nombre)}</h4>
        <div class="price">${fmtMoney(p.precio)}</div>
        <div class="low">${st != null && st > 0 && st <= 5 ? 'Quedan ' + st : ''}</div>
        ${control}
      </div>
    </div>`;
}

function renderShopScreen(){
  const el = document.getElementById('shop-screen');
  if (!el) return;
  if (dbMode === 'init'){ el.innerHTML = renderLoading(); return; }
  const t = getTienda();
  if (!t.abierta && !shopPreview){ el.innerHTML = shopMaintHtml(t); return; }
  const y = window.scrollY;
  const publicos = productosPublicos();
  const cats = ['Todas'].concat(Array.from(new Set(publicos.map(p => p.categoria || 'Otros'))).sort());
  if (cats.indexOf(shopFilter) === -1) shopFilter = 'Todas';
  const items = cartItems();
  const count = items.reduce((a,i) => a + i.q, 0);
  const total = items.reduce((a,i) => a + i.subtotal, 0);
  el.innerHTML = `
    ${shopPreview && !t.abierta ? `<div class="shop-preview-banner">Vista previa del administrador · los clientes ven "En mantenimiento" hasta que abras la tienda</div>` : ''}
    <div class="shop-header">
      <button class="btn btn-ghost btn-sm" data-shop-back="1">← Volver</button>
      <h1>Tienda</h1>
      <button class="shop-cart-btn" data-shop-cart="1" title="Ver carrito">${ICON.cart}${count ? `<span class="cbadge">${count}</span>` : ''}</button>
    </div>
    <div class="shop-body">
      <p style="margin:0 0 14px; color:var(--ink-dim); font-size:13.5px;">Materiales para armar tus propios carteles de neón.</p>
      <div class="filterbar"><div class="searchbox">${ICON.search}<input type="text" id="shopSearchInput" placeholder="Buscar producto…" value="${esc(shopSearch)}"></div></div>
      <div class="filterbar">${cats.map(c => `<button class="chip ${shopFilter===c?'active':''}" data-shop-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div id="shop-grid">${shopGridHtml()}</div>
    </div>
    ${count ? `<div class="shop-cartbar"><button class="btn btn-primary btn-block" data-shop-cart="1">${ICON.cart}Ver carrito · ${count} ${count === 1 ? 'producto' : 'productos'} · ${fmtMoney(total)}</button></div>` : ''}

function captureCartForm(){
  const n = document.getElementById('cf-nombre');
  if (n) cartForm.nombre = n.value;
  const d = document.getElementById('cf-dir');
  if (d) cartForm.dir = d.value;
  const o = document.getElementById('cf-notas');
  if (o) cartForm.notas = o.value;

function openCartModal(){
  captureCartForm();
  const items = cartItems();
  if (!items.length){
    openModal(`${modalHead('Tu carrito')}<span id="cart-modal-marker" hidden></span><div class="empty"><b>Tu carrito está vacío</b>Agregá productos desde la tienda.</div>
      <div class="modal-actions"><button class="btn btn-primary modal-close" style="flex:1;">Seguir mirando</button></div>`);
    return;
  }
  const total = items.reduce((a,i) => a + i.subtotal, 0);
  openModal(`
    ${modalHead('Tu carrito')}
    <span id="cart-modal-marker" hidden></span>
    <div>
      ${items.map(i => `
        <div class="cart-line">
          <div class="nm">${esc(i.p.nombre)}<small>${fmtMoney(i.p.precio)} c/u · ${fmtMoney(i.subtotal)}</small></div>
          <div class="stepper"><button data-cart-dec="${i.p.id}">−</button><span>${i.q}</span><button data-cart-inc="${i.p.id}">+</button></div>
          <button class="iconbtn" data-cart-del="${i.p.id}" title="Quitar">${ICON.trash}</button>
        </div>`).join('')}
    </div>
    <div class="breakdown-row" style="font-weight:800; color:var(--white); font-size:16px; margin:12px 0;"><span>Total</span><span style="color:var(--green);">${fmtMoney(total)}</span></div>
    <div class="field"><label>Tu nombre</label><input type="text" id="cf-nombre" value="${esc(cartForm.nombre)}" placeholder="Nombre y apellido"></div>
    <div class="field"><label>Localidad / dirección (o "retiro en el local")</label><input type="text" id="cf-dir" value="${esc(cartForm.dir)}" placeholder="Para coordinar el envío o retiro"></div>
    <div class="field"><label>Notas (opcional)</label><textarea id="cf-notas" placeholder="Algo que quieras aclarar sobre el pedido">${esc(cartForm.notas)}</textarea></div>
    <div class="err-msg" id="cf-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-cart-clear="1">Vaciar</button>
      <button class="btn btn-wa" id="cf-send">${ICON.wa}Enviar pedido</button>
    </div>
  `);
  document.getElementById('cf-send').onclick = () => {
    captureCartForm();
    const nombre = cartForm.nombre.trim();
    const dir = cartForm.dir.trim();
    if (!nombre || !dir){ document.getElementById('cf-err').textContent = 'Completá tu nombre y tu localidad o dirección.'; return; }
    // Revisar stock antes de enviar
    const cart = getCart();
    let ajustado = false;
    cartItems(cart).forEach(i => {
      const st = productoStock(i.p);
      if (st != null && i.q > st){ ajustado = true; if (st <= 0) delete cart[i.p.id]; else cart[i.p.id] = st; }
    });
    if (ajustado){
      saveCart(cart); updateShopUI();
      const e = document.getElementById('cf-err');
      if (e) e.textContent = 'Ajustamos algunas cantidades según el stock disponible. Revisá el pedido y volvé a enviarlo.';
      return;
    }
    const lines = items.map(i => `• ${i.q} x ${i.p.nombre} — ${fmtMoney(i.subtotal)}`).join('\n');
    const msg = '¡Hola! Quiero hacer un pedido de materiales en la tienda de Puelo Neón 🛒\n\n' +
      `*Nombre:* ${nombre}\n*Localidad / dirección:* ${dir}\n\n*Pedido:*\n${lines}\n\n*Total: ${fmtMoney(total)}*` +
      (cartForm.notas.trim() ? `\n\n*Notas:* ${cartForm.notas.trim()}` : '') +
      '\n\nQuedo atento/a para coordinar el pago y la entrega. ¡Gracias!';
    window.open(waLink(WHATSAPP_RESERVAS, msg), '_blank', 'noopener');
    showToast('Se abrió WhatsApp con tu pedido');
  };
}

/* ============================== BOTÓN "ATRÁS" DEL CELULAR ============================== */
/* La app es una sola página, así que le damos al navegador un historial propio:
   "atrás" vuelve a la pantalla anterior (o cierra la ventana abierta) en vez de salir del sitio.
   - Entrada 0 ("guardia"): al llegar ahí con "atrás" se sale del sitio, como siempre.
   - Entrada 1 en adelante: pantallas de la app (se crea con el primer toque del usuario). */
let navIndex = 0;
let baseReady = false;
function isAdminAuthed(){
  try { return localStorage.getItem('pueloneon_admin_auth') === 'ok'; } catch(e){ return false; }
}
function ensureBaseEntry(){
  if (baseReady) return;
  baseReady = true;
  navIndex = 1;
  try { history.pushState({ screen: screen, i: 1 }, ''); } catch(e){}
}
document.addEventListener('click', ensureBaseEntry, true);

function goTo(s){
  ensureBaseEntry();
  navIndex += 1;
  try { history.pushState({ screen: s, i: navIndex }, ''); } catch(e){}
  setScreen(s);
}
function goBackScreen(){
  if (navIndex > 1){ history.back(); return; }
  setScreen('gate');
  try { history.replaceState({ screen: 'gate', i: navIndex }, ''); } catch(e){}
}
window.addEventListener('popstate', (e) => {
  const root = document.getElementById('modal-root');
  const preview = document.getElementById('splash-preview');
  if ((root && root.children.length) || preview){
    // Hay una ventana abierta: "atrás" solo la cierra y deja al usuario en la misma pantalla.
    try { history.pushState({ screen: screen, i: navIndex }, ''); } catch(err){}
    if (preview) preview.remove();
    closeModal();
    return;
  }
  const st = e.state || {};
  if (st.guard){ history.back(); return; }   // estábamos en la primera pantalla: ahora sí salimos del sitio
  let target = st.screen || 'gate';
  if (target === 'admin' && !isAdminAuthed()) target = 'gate';
  navIndex = st.i || 0;
  if (target !== screen) setScreen(target);
});

/* ============================== INIT ============================== */
renderGateScreen();
try {
  const qp = new URLSearchParams(location.search);
  if (qp.has('cliente') || location.hash === '#cliente'){ directClient = true; setScreen('client'); }
} catch(e){}
try { history.replaceState({ screen: screen, i: 0, guard: true }, ''); } catch(e){}
initData();
})();
</script>
